 {t:"Circular flow model",de:"Wirtschaftskreislauf",ch:"s0",d:"Diagram of the economy: households and firms interact in markets for goods and services (households buy) and markets for factors of production (firms buy). Outer arrows: money; inner arrows: inputs and outputs.",x:"Geldstrom außen, Güter- und Faktorstrom innen. Für die Gesamtwirtschaft gilt Einkommen = Ausgaben."},
 {t:"Factors of production",de:"Produktionsfaktoren",ch:"s0",d:"Inputs used to produce goods and services: labor, land and capital.",x:"Arbeit, Boden, Kapital. Haushalte verkaufen sie auf Faktormärkten an Firmen."},
 {t:"Production possibilities frontier (PPF)",de:"Produktionsmöglichkeitenkurve (Transformationskurve)",ch:"s0",d:"Graph showing the combinations of output that the economy can possibly produce given its resources and technology. Points on it are efficient, inside inefficient, outside not feasible. Its slope is the opportunity cost.",x:"Nach außen gewölbt, weil Ressourcen spezialisiert sind: Opportunitätskosten steigen. Technischer Fortschritt verschiebt sie nach außen (Wachstum)."},
 {t:"Positive analysis",de:"Positive Analyse",ch:"s0",d:"Attempt to describe the world as it is; descriptive; can be confirmed or refuted by evidence. Answers 'What is?' or 'What will be?'.",x:"Beschreibend, überprüfbar. Beispiel: 'Ein Mindestlohn erhöht die Arbeitslosigkeit von Ungelernten.'"},
 {t:"Normative analysis",de:"Normative Analyse",ch:"s0",d:"Attempt to prescribe how the world should be; prescriptive. Answers 'What ought to be?'.",x:"Wertend. Beispiel: 'Der Staat sollte den Mindestlohn erhöhen.'"},
 {t:"Why economists disagree",de:"Warum Ökonomen uneinig sind",ch:"s0",d:"Different scientific judgments (validity of theories, size of parameters), different values (normative views, e.g. Peter and Paula well tax), and perception vs. reality (e.g. rent control, trade barriers).",x:"Drei Gründe merken: wissenschaftliche Urteile, Werte, Wahrnehmung vs. Realität."},
 {t:"Slope",de:"Steigung",ch:"s0",d:"Rise over run: change in y divided by change in x. Emma's demand curve from (21, $6) to (13, $8): -2/8 = -1/4.",f:"slope = change in y / change in x",x:"Flache Gerade = kleine Steigung, steile = große, horizontal = 0, vertikal = unendlich."},
 {t:"Omitted variable",de:"Ausgelassene Variable",ch:"s0",d:"A variable not shown in a graph that affects both variables and can make a graph deceptive (lighters and cancer: the omitted variable is cigarettes smoked).",x:"Scheinkorrelation durch eine dritte, nicht berücksichtigte Größe."},
 {t:"Reverse causality",de:"Umgekehrte Kausalität",ch:"s0",d:"Deciding that A causes B when in fact B causes A (police and crime).",x:"Mehr Polizei in gefährlichen Städten heißt nicht, dass Polizei Kriminalität verursacht."},
 // ---------- s1
 {t:"Absolute advantage",de:"Absoluter Vorteil",ch:"s1",d:"The ability to produce a good using fewer inputs than another producer.",x:"Rose braucht 20 Min. pro Unze Fleisch, Frank 60 Min.: Rose hat den absoluten Vorteil (bei beiden Gütern)."},
 {t:"Comparative advantage",de:"Komparativer Vorteil",ch:"s1",d:"The ability to produce a good at a lower opportunity cost than another producer. One person can have the absolute advantage in both goods but cannot have the comparative advantage in both.",x:"Entscheidend für Spezialisierung und Handel ist der komparative, nicht der absolute Vorteil (David Ricardo)."},
 {t:"Specialization",de:"Spezialisierung",ch:"s1",d:"Concentrating on producing the good in which one has a comparative advantage; total production rises and everyone can be better off.",x:"Der Kuchen wird größer, Handel ist kein Nullsummenspiel."},
 {t:"Price of trade",de:"Tauschverhältnis / Handelspreis",ch:"s1",d:"For both sides to gain, the price at which goods are traded must lie between the two producers' opportunity costs.",x:"Frank und Rose: 5 oz Fleisch gegen 15 oz Kartoffeln = 3 Kartoffeln pro Fleisch, liegt zwischen 2 (Rose) und 4 (Frank)."},
 {t:"Imports",de:"Importe",ch:"s1",d:"Goods produced abroad and sold domestically.",x:"Einfuhren."},
 {t:"Exports",de:"Exporte",ch:"s1",d:"Goods produced domestically and sold abroad.",x:"Ausfuhren."},
 {t:"Factor endowments",de:"Faktorausstattung",ch:"s1",d:"Source of comparative advantage: a country well endowed with a factor (e.g. Canada's forests) can produce goods using it more cheaply.",x:"Kanada hat viel Wald, also komparativen Vorteil bei Papier."},
 {t:"Factor abundance",de:"Faktorreichtum",ch:"s1",d:"The supply of a factor of production relative to other factors.",x:"Wie viel Wald hat ein Land im Vergleich zu Maschinen oder Menschen?"},
 {t:"Factor intensity",de:"Faktorintensität",ch:"s1",d:"A measure of the quantity of a factor used in comparison with other factors in producing a good.",x:"Wie viel Arbeit wird im Vergleich zu Kapital oder Rohstoffen eingesetzt?"},
 {t:"Increasing returns to scale",de:"Steigende Skalenerträge",ch:"s1",d:"Productivity rises with the quantity of output (8% more labor and 9% more materials raise output by 10%). Leads to few large producers and trade (wide-bodied aircraft: Seattle and Toulouse).",x:"Großproduktion ist effizienter, deshalb konzentriert sich die Produktion auf wenige Länder."},
 {t:"Autarky",de:"Autarkie",ch:"s1",d:"A situation without international trade; price and quantity depend only on domestic supply and demand.",x:"Geschlossene Volkswirtschaft. Rumiche nennt Nordkorea als Beispiel."},
 {t:"World price",de:"Weltmarktpreis",ch:"s1",d:"The price at which a good can be bought or sold abroad (Pw).",x:"Liegt Pw unter dem Autarkiepreis, wird importiert, liegt er darüber, wird exportiert."},
 {t:"Consumer surplus",de:"Konsumentenrente",ch:"s1",d:"The amount a buyer is willing to pay for a good minus the amount actually paid; area below demand and above price.",f:"CS = willingness to pay - price",x:"Was Käufer 'sparen'. Bei Importen steigt sie (Fläche X + Z)."},
 {t:"Producer surplus",de:"Produzentenrente",ch:"s1",d:"The amount a seller is paid minus the seller's cost; area above supply and below price.",f:"PS = price - cost",x:"Bei Exporten steigt sie (X + Z), Konsumenten verlieren X."},
 {t:"Total surplus",de:"Gesamtrente / Wohlfahrt",ch:"s1",d:"Consumer surplus + producer surplus (+ government revenue). Trade increases total surplus (area Z) whether a country imports or exports.",x:"Gewinner gewinnen mehr als Verlierer verlieren."},
 {t:"Trade and wages (Heckscher-Ohlin)",de:"Handel und Löhne",ch:"s1",d:"Trade raises demand for abundant factors and lowers demand for scarce factors. In the US: wages of highly educated workers rise, wages of unskilled workers fall; trade increases wage inequality.",x:"Besitzer des reichlich vorhandenen Faktors gewinnen, die des knappen Faktors verlieren."},
 {t:"Free trade",de:"Freihandel",ch:"s1",d:"Government policy does not attempt to reduce or increase the levels of exports and imports that occur naturally through supply and demand.",x:"Seit Ricardo empfehlen Ökonomen Freihandel."},
 {t:"Trade protection",de:"Protektionismus",ch:"s1",d:"Policies that limit imports; most common are tariffs and import quotas.",x:"Hilft heimischen Produzenten, schadet heimischen Konsumenten."},
 {t:"Tariff",de:"Zoll",ch:"s1",d:"A tax levied on imports. Raises the domestic price, increases domestic production, lowers consumption, creates government revenue and deadweight loss (areas B and D).",x:"B = Verschwendung durch ineffiziente heimische Produktion, D = nicht mehr stattfindende vorteilhafte Käufe."},
 {t:"Import quota",de:"Einfuhrquote / Importkontingent",ch:"s1",d:"A legal limit on the quantity of a good that can be imported. Same effect as a tariff, but instead of government revenue 'quota rents' go to license holders (usually foreigners).",x:"Wie ein Zoll, nur kassiert nicht der Staat, sondern der Lizenzinhaber."},
 {t:"Quota rent",de:"Quotenrente",ch:"s1",d:"The earnings that accrue to holders of import licenses under a quota (difference between domestic and world price times quota quantity).",x:"Entspricht der Fläche, die beim Zoll Staatseinnahme wäre."},
 {t:"Deadweight loss",de:"Wohlfahrtsverlust (Nettowohlfahrtsverlust)",ch:"s1",d:"Loss of total surplus because the efficient market equilibrium is not reached (excess burden, allocative inefficiency). With a tariff: areas B + D.",x:"Rumiche übersetzt: Mitnahmeeffekt / Wohlfahrtsverlust. Verlust, dem kein Gewinn gegenübersteht."},
 {t:"National security argument",de:"Argument der nationalen Sicherheit",ch:"s1",d:"A country should protect domestic suppliers of crucial goods to be self-sufficient, even in peacetime.",x:"Argument für Protektion."},
 {t:"Job creation argument",de:"Arbeitsplatzargument",ch:"s1",d:"Protection creates jobs; economists argue these are often offset by jobs lost elsewhere.",x:"Argument für Protektion, aber meist Nullsumme."},
 {t:"Infant industry argument",de:"Erziehungszollargument",ch:"s1",d:"New industries need temporary protection to develop. Critique: politically influential industries get protection; governments are poor at picking winners.",x:"Junge Industrien schützen, bis sie wettbewerbsfähig sind."},
 {t:"International trade agreements",de:"Internationale Handelsabkommen",ch:"s1",d:"Treaties in which a country promises to reduce tariffs in return for the other country doing the same: NAFTA (now USMCA), EU, global WTO.",x:"Gegenseitiger Zollabbau."},
 {t:"WTO",de:"Welthandelsorganisation",ch:"s1",d:"World Trade Organization: oversees international trade agreements and rules on disputes; created to enforce GATT.",x:"Schiedsrichter des Welthandels."},
 // ---------- s2
 {t:"Gross domestic product (GDP)",de:"Bruttoinlandsprodukt (BIP)",ch:"s2",d:"The market value of all final goods and services produced within a country in a given period of time. Measures both total income and total expenditure.",f:"Y = C + I + G + NX",x:"Jedes Wort der Definition hat Bedeutung: Marktwert, alle (legal gehandelten), final, Güter und Dienstleistungen, produziert (aktuell), im Inland, in einem Zeitraum."},
 {t:"Final goods",de:"Endprodukte",ch:"s2",d:"Goods sold to the final user; only these are counted in GDP because the value of intermediate goods is already included in their prices.",x:"Verhindert Doppelzählung."},
 {t:"Intermediate goods",de:"Vorleistungen / Zwischenprodukte",ch:"s2",d:"Goods used in the production process that are not final goods and services; not counted separately in GDP.",x:"Mehl für den Bäcker zählt nicht extra, nur das Brot."},
 {t:"Consumption (C)",de:"Privater Konsum",ch:"s2",d:"Spending by households on goods and services, except purchases of new housing. Germany 2024: 53% of GDP.",x:"Größte Komponente des BIP."},
 {t:"Investment (I)",de:"Investitionen",ch:"s2",d:"Spending on capital equipment, inventories and structures, including household purchases of new housing and inventory accumulation. Germany 2024: 21%.",x:"Achtung: neue Wohnungen von Haushalten zählen zu I, nicht C. Unverkaufte Lagerbestände zählen auch zu I."},
 {t:"Government purchases (G)",de:"Staatsausgaben (Staatskonsum)",ch:"s2",d:"Government consumption expenditure and gross investment by local, state and federal governments; does NOT include transfer payments. Germany 2024: 22%.",x:"Transferzahlungen wie Rente oder Arbeitslosengeld zählen nicht, da keine Gegenleistung produziert wird."},
 {t:"Transfer payments",de:"Transferzahlungen",ch:"s2",d:"Government payments not made in exchange for a good or service (e.g. unemployment benefits); excluded from G and GDP.",x:"Umverteilung, keine Produktion."},
 {t:"Net exports (NX)",de:"Nettoexporte / Außenbeitrag",ch:"s2",d:"Exports minus imports. Germany 2024: 4% of GDP.",f:"NX = exports - imports",x:"Positiv = Handelsbilanzüberschuss."},
 {t:"Trade deficit",de:"Handelsbilanzdefizit",ch:"s2",d:"The excess of imports over exports.",x:"NX < 0."},
 {t:"Trade surplus",de:"Handelsbilanzüberschuss",ch:"s2",d:"The excess of exports over imports.",x:"NX > 0, typisch für Deutschland."},
 {t:"Nominal GDP",de:"Nominales BIP",ch:"s2",d:"Production of goods and services valued at current prices.",x:"Steigt, wenn mehr produziert wird ODER Preise steigen."},
 {t:"Real GDP",de:"Reales BIP",ch:"s2",d:"Production of goods and services valued at constant (base-year) prices; not affected by price changes. In the base year nominal = real GDP.",x:"Misst nur die Mengenänderung."},
 {t:"Base year",de:"Basisjahr",ch:"s2",d:"The benchmark year whose prices are used to compute real GDP or a price index; the index equals 100 in the base year.",x:"Bezugsjahr."},
 {t:"Economic growth",de:"Wirtschaftswachstum",ch:"s2",d:"Sustained increases in the real GDP of an economy over time; in the PPF picture an outward shift.",x:"Real, nicht nominal."},
 {t:"GDP deflator",de:"BIP-Deflator",ch:"s2",d:"Measures the current level of prices relative to the base year: ratio of nominal to real GDP times 100. Reflects prices of all goods and services produced domestically.",f:"GDP deflator = nominal GDP / real GDP x 100",x:"Ist 100 im Basisjahr. Damit kann man das nominale BIP 'deflationieren'."},
 {t:"Inflation rate",de:"Inflationsrate",ch:"s2",d:"Percentage change in a measure of the price level from one period to the next.",f:"inflation = (P2 - P1) / P1 x 100",x:"Funktioniert mit CPI oder BIP-Deflator."},
 {t:"Shadow economy",de:"Schattenwirtschaft",ch:"s2",d:"Market activity hidden from authorities (underground economy); not included in GDP. Medina/Schneider (2019) estimate its size by country.",x:"Ein Grund, warum das BIP die Wohlfahrt unvollständig misst."},
 {t:"GDP as a measure of welfare",de:"BIP als Wohlfahrtsmaß",ch:"s2",d:"Best single measure of economic well-being (income, expenditure, inputs into a worthwhile life), but excludes leisure, non-market activity (housework, childcare), environment, underground economy and says nothing about distribution.",x:"Reiche Länder haben höhere Lebenserwartung, Alphabetisierung usw., aber BIP ist nicht alles."},
 {t:"Consumer price index (CPI)",de:"Verbraucherpreisindex (VPI)",ch:"s2",d:"A measure of the overall cost of a fixed basket of goods and services bought by a typical consumer, published by statistical offices.",f:"CPI = cost of basket in current year / cost of basket in base year x 100",x:"5 Schritte: Warenkorb fixieren, Preise ermitteln, Kosten des Korbs, Basisjahr wählen und Index, Inflationsrate."},
 {t:"Basket of goods",de:"Warenkorb",ch:"s2",d:"The fixed set of goods and services, weighted by importance ('relative importance'), whose cost is tracked by the CPI.",x:"Folie: 4 Hot Dogs und 2 Hamburger."},
 {t:"Producer price index (PPI)",de:"Erzeugerpreisindex",ch:"s2",d:"A measure of the cost of a basket of goods and services bought by firms; changes often predict changes in the CPI.",x:"Frühindikator für Verbraucherpreise."},
 {t:"Substitution bias",de:"Substitutionsverzerrung",ch:"s2",d:"CPI problem: prices do not change proportionately and consumers substitute toward goods that have become relatively cheaper, but the fixed basket ignores this; the CPI overstates the cost of living.",x:"Der Index überschätzt die Inflation."},
 {t:"Introduction of new goods (CPI bias)",de:"Verzerrung durch neue Güter",ch:"s2",d:"New goods increase variety and the value of a dollar, but enter the CPI late (cell phones introduced 1983, included 1998; upward bias of 0.8 to 1.9% in telecom).",x:"Auch Klimaanlagen kamen erst nach 15 Jahren in den Index."},
 {t:"Unmeasured quality change",de:"Nicht gemessene Qualitätsänderung",ch:"s2",d:"If quality rises but the price stays the same, the value of a dollar rises; the CPI often fails to capture this.",x:"Dritter Messfehler des VPI."},
 {t:"GDP deflator vs. CPI",de:"BIP-Deflator vs. VPI",ch:"s2",d:"Deflator: all goods produced domestically, changing basket. CPI: goods bought by consumers (including imports), fixed basket. Both measures generally move together.",x:"Importierte Güter: nur im VPI. Investitionsgüter: nur im Deflator."},
 {t:"Real-nominal principle",de:"Real-Nominal-Prinzip",ch:"s2",d:"What matters to people is the real value of money or income (its purchasing power), not its face value.",x:"Nominalwert = Nennwert; Realwert = was man dafür kaufen kann."},
 {t:"Nominal value",de:"Nominalwert",ch:"s2",d:"The face value of an amount of money.",x:"Nennwert."},
 {t:"Real value",de:"Realwert",ch:"s2",d:"The value of an amount of money in terms of what it can buy.",x:"Kaufkraft."},
 {t:"Indexation",de:"Indexierung",ch:"s2",d:"Automatic correction by law or contract of a dollar amount for the effects of inflation.",f:"amount today = amount in year T x (price level today / price level in year T)",x:"Beispiel: COLA."},
 {t:"Cost-of-living adjustment (COLA)",de:"Inflationsausgleich",ch:"s2",d:"Automatic increases in wages or other payments that are tied to the CPI.",x:"Lohn steigt automatisch mit dem Index."},
 {t:"Nominal interest rate",de:"Nominalzins",ch:"s2",d:"The interest rate as usually reported, without correction for inflation.",x:"Der Zins, den die Bank nennt."},
 {t:"Real interest rate",de:"Realzins",ch:"s2",d:"The interest rate corrected for the effects of inflation. During inflation it is below the nominal rate, during deflation above.",f:"real interest rate = nominal interest rate - inflation rate",x:"Was man an Kaufkraft wirklich gewinnt."},
 {t:"Deflation",de:"Deflation",ch:"s2",d:"A decrease in the overall price level (negative inflation); the real interest rate then exceeds the nominal rate.",x:"Sinkendes Preisniveau.",src:"added"},
 // ---------- s3
 {t:"Real GDP per person",de:"Reales BIP pro Kopf",ch:"s3",d:"Measure of the living standard; varies widely from country to country.",x:"Grundlage für Wachstums- und Wohlstandsvergleiche."},
 {t:"Growth rate",de:"Wachstumsrate",ch:"s3",d:"The percentage rate of change from one period to another.",f:"growth = (X2 - X1) / X1 x 100",x:"Prozentuale Veränderung."},
 {t:"Rule of 70",de:"70er-Regel",ch:"s3",d:"Rule of thumb: output will double in 70/x years, where x is the percentage growth rate.",f:"doubling time = 70 / growth rate (%)",x:"Bei 2% Wachstum verdoppelt sich das BIP in ca. 35 Jahren."},
 {t:"Physical capital",de:"Sachkapital",ch:"s3",d:"The stock of equipment and structures used to produce goods and services.",x:"Maschinen, Gebäude. Determinante der Produktivität."},
 {t:"Human capital",de:"Humankapital",ch:"s3",d:"The knowledge and skills that workers acquire through education, training and experience.",x:"Bildung und Erfahrung."},
 {t:"Natural resources",de:"Natürliche Ressourcen",ch:"s3",d:"Inputs provided by nature such as land, rivers and mineral deposits; renewable or nonrenewable.",x:"Begrenzen sie das Wachstum? Technischer Fortschritt findet oft Wege drumherum; Rohstoffpreise sind langfristig stabil oder fallend."},
 {t:"Technological knowledge",de:"Technisches Wissen",ch:"s3",d:"Society's understanding of the best ways to produce goods and services.",x:"Vierte Determinante der Produktivität."},
 {t:"Diminishing returns",de:"Abnehmende Grenzerträge",ch:"s3",d:"The benefit from an extra unit of an input declines as the quantity of the input increases. A higher saving rate raises the level of productivity and income in the long run, but not their growth rate.",x:"Die Produktionsfunktion wird flacher, je mehr Kapital pro Arbeiter."},
 {t:"Production function",de:"Produktionsfunktion",ch:"s3",d:"Shows how capital per worker influences output per worker (other determinants constant); flattens because of diminishing returns.",x:"Bei wenig Kapital großer Zuwachs, bei viel Kapital kleiner."},
 {t:"Catch-up effect",de:"Aufholeffekt (Konvergenz)",ch:"s3",d:"Countries that start off poor tend to grow more rapidly than countries that start off rich, because small capital investments raise productivity a lot.",x:"Folgt aus abnehmenden Grenzerträgen."},
 {t:"Political stability",de:"Politische Stabilität",ch:"s3",d:"Instability (revolutions, coups) threatens property rights, so residents save and invest less and foreigners invest less.",x:"Voraussetzung für Wachstum."},
 {t:"Corruption",de:"Korruption",ch:"s3",d:"Impedes the coordinating power of markets, discourages domestic saving and investment from abroad.",x:"Folge fehlender Eigentumsrechte."},
 {t:"Economic fluctuations",de:"Konjunkturschwankungen",ch:"s3",d:"Short-run changes in the growth of GDP (business cycles), examined by comparing real GDP with a trend line. US real GDP grew about 3% per year since 1965, interrupted by recessions.",x:"Drei Merkmale: Co-Bewegung, begrenzte Vorhersagbarkeit, Persistenz."},
 {t:"Recession",de:"Rezession",ch:"s3",d:"Commonly defined as two consecutive quarters (six months) of declining real GDP: lower income, rising unemployment, falling profits, more bankruptcies.",x:"Technische Rezession: zwei Quartale in Folge sinkendes reales BIP."},
 {t:"Peak",de:"Hochpunkt (Konjunkturgipfel)",ch:"s3",d:"The date at which a recession starts.",x:"Oberer Wendepunkt."},
 {t:"Trough",de:"Tiefpunkt (Konjunkturtal)",ch:"s3",d:"The date at which output stops falling in a recession.",x:"Unterer Wendepunkt."},
 {t:"Expansion",de:"Aufschwung (Expansion)",ch:"s3",d:"The period after a trough in the business cycle during which the economy recovers.",x:"Erholungsphase."},
 {t:"Depression",de:"Depression",ch:"s3",d:"The common name for a severe recession (e.g. Great Depression 1929-1933).",x:"Sehr tiefe und lange Rezession."},
 {t:"Co-movement",de:"Gleichlauf (Co-Bewegung)",ch:"s3",d:"Many aggregate variables grow or contract together: consumption, investment, employment move with real GDP; unemployment moves against it.",x:"Erstes Merkmal von Konjunkturschwankungen."},
 {t:"Limited predictability",de:"Begrenzte Vorhersagbarkeit",ch:"s3",d:"Recessions and expansions do not follow a repetitive pattern; it is impossible to forecast when they will end.",x:"Zweites Merkmal."},
 {t:"Persistence",de:"Persistenz",ch:"s3",d:"Growth is not random but persistent: when the economy is growing (contracting) it will probably keep doing so the following quarter.",x:"Drittes Merkmal."},
 {t:"Causes of fluctuations",de:"Ursachen von Konjunkturschwankungen",ch:"s3",d:"Technology shocks, changing sentiments, monetary/financial factors. At the start of a recession labor demand shifts left (lower output prices or demand, lower productivity, higher input prices).",x:"Arbeitsnachfrage sinkt, dadurch sinkt Beschäftigung und reales BIP."},
 {t:"Downward rigid wages",de:"Nach unten starre Löhne",ch:"s3",d:"If wages cannot fall, a leftward shift of labor demand leaves the wage unchanged and causes a larger fall in employment and output than with flexible wages.",x:"Starre Löhne verstärken die Rezession."},
 {t:"Employed",de:"Erwerbstätige",ch:"s3",d:"Those who work: paid employees, self-employed, unpaid workers in a family business, full- and part-time, and those temporarily absent (vacation, illness, weather).",x:"Auch Teilzeit und vorübergehend Abwesende zählen."},
 {t:"Unemployed",de:"Erwerbslose / Arbeitslose",ch:"s3",d:"Individuals who do not currently have a job, are available for work and are actively looking for work.",x:"'Aktiv suchen' ist entscheidend."},
 {t:"Not in the labor force",de:"Nichterwerbspersonen",ch:"s3",d:"Neither employed nor unemployed: full-time students, homemakers, retirees (non-active population).",x:"Zählen nicht zur Erwerbsbevölkerung."},
 {t:"Labor force",de:"Erwerbspersonen",ch:"s3",d:"Total number of workers, employed plus unemployed (active population). ILO concept: Erwerbspersonen = Erwerbstätige + Erwerbslose.",f:"labor force = employed + unemployed",x:"Der ILO-Begriff unterscheidet sich von der nationalen Arbeitslosenstatistik."},
 {t:"Unemployment rate",de:"Arbeitslosenquote (Erwerbslosenquote)",ch:"s3",d:"Percentage of the labor force that is unemployed.",f:"unemployment rate = unemployed / labor force x 100",x:"Nenner ist die Erwerbsbevölkerung, NICHT die Gesamtbevölkerung."},
 {t:"Labor-force participation rate",de:"Erwerbsquote",ch:"s3",d:"Percentage of the adult population that is in the labor force.",f:"participation rate = labor force / adult population x 100",x:"Im Lernziel genannt; Formel aus dem Standardlehrbuch (Mankiw).",src:"added"},
 {t:"Natural rate of unemployment",de:"Natürliche Arbeitslosenquote",ch:"s3",d:"The level of unemployment with no cyclical unemployment; only frictional, seasonal and structural unemployment. The rate at full employment.",x:"Auch bei Vollbeschäftigung gibt es Arbeitslosigkeit."},
 {t:"Full employment",de:"Vollbeschäftigung",ch:"s3",d:"The level of unemployment that occurs when the unemployment rate is at the natural rate.",x:"Nicht 0% Arbeitslosigkeit!"},
 {t:"Frictional unemployment",de:"Friktionelle Arbeitslosigkeit (Sucharbeitslosigkeit)",ch:"s3",d:"Unemployment from the normal workings of the economy: workers searching for suitable jobs, firms searching for qualified workers. Healthy; no policy needed.",x:"Kurze Dauer. USA Feb 2023: Arbeitslosigkeit überwiegend friktionell."},
 {t:"Structural unemployment",de:"Strukturelle Arbeitslosigkeit",ch:"s3",d:"Unemployment from a mismatch of skills and jobs (technological change, international competition, resource depletion). Remedy: worker retraining. Also arises when wages are above equilibrium.",x:"Mindestlohn, Gewerkschaften, Effizienzlöhne können sie verursachen."},
 {t:"Seasonal unemployment",de:"Saisonale Arbeitslosigkeit",ch:"s3",d:"Unemployment attributed to seasonal factors (weather and seasons). Neutral; no policy needed.",x:"Bau im Winter, Tourismus."},
 {t:"Cyclical unemployment",de:"Konjunkturelle Arbeitslosigkeit",ch:"s3",d:"Unemployment that occurs during fluctuations in real GDP (business cycles). Unhealthy; addressed with fiscal or monetary policy.",x:"Einzige 'ungesunde' Art laut Tabelle."},
 {t:"Okun relationship (growth and unemployment)",de:"Wachstum und Arbeitslosigkeit",ch:"s3",d:"Strong negative relationship: the US unemployment rate fell when growth was above its average of 3.11% a year and rose when growth was below.",x:"Auf der Folie ohne Namen; im Lehrbuch als Okunsches Gesetz bekannt."},
 {t:"Minimum wage",de:"Mindestlohn",ch:"s3",d:"A legal wage floor. If above equilibrium (WE), quantity of labor supplied rises to LS and demanded falls to LD; the surplus LS - LD is unemployment.",x:"Ursache struktureller Arbeitslosigkeit, vor allem bei jungen und ungelernten Arbeitskräften."},
 {t:"Union",de:"Gewerkschaft",ch:"s3",d:"A worker association that bargains with employers over wages, benefits and working conditions; raises wages above equilibrium (US union workers earn 10-20% more).",x:"Pro: Gegenmacht zu Firmen. Contra: Kartell, ineffizient, ungerecht gegenüber Outsidern."},
 {t:"Collective bargaining",de:"Tarifverhandlungen",ch:"s3",d:"The process by which unions and firms agree on the terms of employment.",x:"Tarifverhandlung."},
 {t:"Strike",de:"Streik",ch:"s3",d:"The organized withdrawal of labor from a firm by a union; reduces production, sales and profit.",x:"Druckmittel der Gewerkschaft."},
 {t:"Insider-outsider theory",de:"Insider-Outsider-Theorie",ch:"s3",d:"Insiders (incumbent employees protected by turnover costs) use market power; outsiders (unemployed or informal sector) bear the cost and may stay unemployed.",x:"Beschäftigte schützen sich auf Kosten der Arbeitslosen."},
 {t:"Efficiency wages",de:"Effizienzlöhne",ch:"s3",d:"Above-equilibrium wages paid by firms to raise productivity: better worker health, lower turnover, higher worker quality, more effort.",x:"Beispiel Ford 1914: 5 USD pro Tag (doppelter Marktlohn), weniger Fluktuation, mehr Produktivität, profitabel."},
 {t:"Unemployment insurance",de:"Arbeitslosenversicherung",ch:"s3",d:"Higher benefits reduce the incentive to search and increase unemployment; US states that cut benefits most after Dec 2013 had faster employment growth (Hagedorn, Mitman, Manovskii).",x:"Anreizwirkung."},
 // ---------- s4
 {t:"Money",de:"Geld",ch:"s4",d:"Assets regularly used to buy goods and services, with three properties: medium of exchange, unit of account, store of value.",x:"Drei Funktionen merken: Tauschmittel, Recheneinheit, Wertaufbewahrung."},
 {t:"Medium of exchange",de:"Tauschmittel",ch:"s4",d:"Any item that buyers give to sellers when they purchase goods and services.",x:"Löst das Problem des Tauschhandels."},
 {t:"Barter",de:"Tauschhandel",ch:"s4",d:"The exchange of one good or service for another.",x:"Ohne Geld."},
 {t:"Double coincidence of wants",de:"Doppelte Übereinstimmung der Wünsche",ch:"s4",d:"The problem in a barter system that one person may not have what the other desires.",x:"Geld überwindet dieses Problem."},
 {t:"Unit of account",de:"Recheneinheit",ch:"s4",d:"A standard unit in which prices can be stated and the value of goods and services compared.",x:"Preise in Euro."},
 {t:"Store of value",de:"Wertaufbewahrungsmittel",ch:"s4",d:"Money preserves value until it is used in an exchange.",x:"Inflation schwächt diese Funktion."},
 {t:"Principle of voluntary exchange",de:"Prinzip des freiwilligen Tauschs",ch:"s4",d:"A voluntary exchange between two people makes both people better off.",x:"Sonst würden sie nicht tauschen."},
 {t:"M1",de:"Geldmenge M1",ch:"s4",d:"The sum of currency in circulation and overnight deposits (demand deposits, other liquid deposits). US Nov 2021: 20,333 billion USD.",x:"Engste Geldmenge."},
 {t:"M2",de:"Geldmenge M2",ch:"s4",d:"M1 plus deposits with an agreed maturity of up to two years and deposits redeemable at notice of up to three months. US Nov 2021: 23,373 billion USD.",x:"Weitere Geldmenge."},
 {t:"Currency",de:"Bargeld",ch:"s4",d:"Paper money and coins held by the public. Much is held abroad or by criminals; not a good way to hold wealth (can be lost, earns no interest).",x:"Griechenland 2015: Bargeldhortung aus Misstrauen gegenüber dem Bankensystem."},
 {t:"Reserves",de:"Reserven",ch:"s4",d:"The portion of banks' deposits set aside as vault cash or as deposits at the central bank.",x:"Banken verdienen (traditionell) keine Zinsen darauf."},
 {t:"Required reserves",de:"Mindestreserven",ch:"s4",d:"The specific fraction of deposits that banks are required by law to hold as reserves.",x:"Beispiel Folie: 10% Mindestreserve."},
 {t:"Excess reserves",de:"Überschussreserven",ch:"s4",d:"Any additional reserves a bank holds above required reserves. Grew hugely after 2008 because the Fed injected reserves and began paying interest on them.",x:"Werden sie nicht verliehen, schrumpft der tatsächliche Geldmultiplikator."},
 {t:"Fractional reserve banking",de:"Teilreservesystem",ch:"s4",d:"Banks hold only a fraction of deposits as reserves and lend out the rest, thereby creating money (but not wealth). With 100% reserve banking banks do not influence the money supply.",x:"Geldschöpfung durch Kredite."},
 {t:"Reserve ratio",de:"Reservesatz",ch:"s4",d:"The ratio of reserves to deposits (R).",x:"Je höher, desto weniger Geldschöpfung."},
 {t:"Money multiplier",de:"Geldschöpfungsmultiplikator",ch:"s4",d:"The amount of money the banking system generates with each dollar of reserves; the reciprocal of the reserve ratio.",f:"money multiplier = 1 / R",x:"R = 10% ergibt Multiplikator 10. In der Realität kleiner (Bargeldhaltung, Überschussreserven)."},
 {t:"Central bank",de:"Zentralbank",ch:"s4",d:"Government institution that monitors financial institutions, controls certain key interest rates and indirectly controls the money supply (monetary policy).",x:"Fed, EZB."},
 {t:"Monetary policy",de:"Geldpolitik",ch:"s4",d:"Central bank actions on interest rates and the money supply; Rumiche: changes in the money supply to fight recessions or inflation.",x:"Expansiv: Zinsen runter. Restriktiv: Zinsen rauf."},
 {t:"Federal Reserve (Fed)",de:"US-Notenbank",ch:"s4",d:"US central bank: Board of Governors (chosen by the president, confirmed by the Senate) and 12 regional banks; policy decided by the FOMC (Board plus five regional presidents).",x:"FOMC = Federal Open Market Committee."},
 {t:"European Central Bank (ECB)",de:"Europäische Zentralbank (EZB)",ch:"s4",d:"Created in January 1999 when 11 nations adopted the euro; located in Frankfurt; runs monetary policy for a combined economy.",x:"Ziel: Preisstabilität (siehe Kapitel Rumiche 09)."},
 {t:"Nominal exchange rate",de:"Nominaler Wechselkurs",ch:"s4",d:"The rate at which one country's currency can be exchanged for another's. Schubert: e = units of foreign currency per 1 unit of domestic currency; 1/e = domestic per foreign.",f:"e = units of foreign currency / 1 unit of domestic currency",x:"Mengennotierung aus Sicht des Inlands. 19.1.2022: 0.88 EUR pro USD."},
 {t:"Appreciation",de:"Aufwertung",ch:"s4",d:"An increase in the value of a currency relative to another; with e defined as foreign per domestic, a rising e means the domestic currency appreciates.",x:"Exporte werden teurer, Importe billiger."},
 {t:"Depreciation",de:"Abwertung",ch:"s4",d:"A decrease in the value of a currency relative to another; a falling e means the domestic currency depreciates.",x:"Exporte werden billiger, Importe teurer."},
 {t:"Flexible exchange rate",de:"Flexibler Wechselkurs",ch:"s4",d:"The government does not intervene in the foreign exchange market; supply and demand determine the rate.",x:"Auch floating."},
 {t:"Fixed exchange rate",de:"Fester Wechselkurs",ch:"s4",d:"The government fixes a value and intervenes to maintain it (needs foreign reserves).",x:"Auch pegged."},
 {t:"Managed exchange rate",de:"Gesteuerter Wechselkurs",ch:"s4",d:"A system between flexible and fixed exchange rates.",x:"Managed float."},
 {t:"Foreign exchange market",de:"Devisenmarkt",ch:"s4",d:"The global financial market in which currencies are traded and nominal exchange rates are determined; analysed with supply and demand (price = exchange rate).",x:"Nachfrage nach Dollar fällt mit steigendem Kurs, Angebot steigt."},
 {t:"Demand for dollars",de:"Nachfrage nach Dollar",ch:"s4",d:"Traders buying dollars with foreign currency. Increases with higher US interest rates or lower US prices, which appreciates the dollar.",x:"Höhere US-Zinsen: Dollar wertet auf."},
 {t:"Supply of dollars",de:"Angebot an Dollar",ch:"s4",d:"Traders selling dollars to obtain foreign currency. Increases with higher European interest rates or lower European prices, which depreciates the dollar.",x:"Höhere EU-Zinsen: Dollar wertet ab."},
 {t:"Real exchange rate",de:"Realer Wechselkurs",ch:"s4",d:"The ratio of the prices of a basket of goods in two countries, converted to the same currency; influences net exports.",f:"E = (domestic price x e) / foreign price",x:"Steigt E, werden heimische Güter relativ teurer: Exporte sinken, Importe steigen."},
 {t:"Undervalued currency (China)",de:"Unterbewertete Währung",ch:"s4",d:"A weak yuan raises the yuan-dollar real exchange rate E: US trade deficit, Chinese surplus, lower US employment. The Fed could respond with expansionary policy (lower rates, less demand for dollars, E falls, US net exports rise).",x:"Beispiel aus Schubert 4.2."},
 {t:"Troubled euro",de:"Euro-Krise",ch:"s4",d:"Funds poured into Spain/Ireland (housing boom) and lent to Greece, Italy, Portugal; after 2007 debts could not be paid and countries could not depreciate. A monetary union without a fiscal system is hard to sustain.",x:"USA haben zusätzlich einen gemeinsamen Haushalt mit Transfers."},
 // ---------- s5
 {t:"Classical macroeconomics",de:"Klassische Makroökonomie",ch:"s5",d:"Short run unimportant, prices flexible, aggregate supply vertical even in the short run, any increase in money supply only leads to inflation with no effect on output.",x:"Konnte die Große Depression nicht erklären."},
 {t:"Great Depression",de:"Große Depression / Weltwirtschaftskrise",ch:"s5",d:"Severe slump of 1929-1933 that showed economists cannot ignore the short run; there was no theory of the business cycle and advice conflicted.",x:"Ausgangspunkt der keynesianischen Revolution."},
 {t:"Keynesian economics",de:"Keynesianismus",ch:"s5",d:"Keynes, General Theory (1936): short-run effects of changes in aggregate demand on output matter; 'animal spirits' cause the business cycle; legitimised policy activism.",x:"'In the long run we are all dead' - Fokus auf die kurze Frist.",},
 {t:"Animal spirits",de:"Animal Spirits (Stimmungen der Unternehmer)",ch:"s5",d:"Keynes: changes in business confidence that cause the business cycle.",x:"Erwartungen und Stimmung treiben Investitionen."},
 {t:"Aggregate demand (AD)",de:"Gesamtwirtschaftliche Nachfrage",ch:"s5",d:"The total demand for goods and services by households, firms, government and foreigners at each price level. Downward sloping.",x:"Siehe auch Rumiche Kapitel 01."},
 {t:"Short-run aggregate supply (SRAS)",de:"Kurzfristiges gesamtwirtschaftliches Angebot",ch:"s5",d:"Classical view: vertical, so AD shifts only change prices. Keynesian view: upward sloping, so AD shifts change both prices and output.",x:"Kernunterschied Klassik vs. Keynes."},
 {t:"Macroeconomic policy activism",de:"Aktive Stabilisierungspolitik",ch:"s5",d:"The use of monetary and fiscal policy to smooth out the business cycle. Roosevelt: modest deficit spending improved the economy; balancing the budget and higher rates in 1937 caused a renewed slump.",x:"Von Keynes legitimiert."},
 {t:"Liquidity trap",de:"Liquiditätsfalle",ch:"s5",d:"Situation in which the interest rate cannot be pushed any lower, so monetary policy is ineffective; Keynes's reason for doubting monetary policy in recessions.",x:"Zinsen schon bei null."},
 {t:"Monetarism",de:"Monetarismus",ch:"s5",d:"Milton Friedman: activist fiscal or monetary policy only makes things worse (time lags); GDP grows steadily if money supply grows steadily; best is a non-activist monetary policy rule ('autopilot').",x:"Friedman/Schwartz 1963: Die Fed hätte die Große Depression verhindern können, wenn sie die Geldbasis erhöht hätte."},
 {t:"Monetary policy rule",de:"Geldpolitische Regel",ch:"s5",d:"A formula that determines the central bank's actions.",x:"Statt Ermessensentscheidungen."},
 {t:"Time lags",de:"Wirkungsverzögerungen",ch:"s5",d:"Delays in recognising problems and in policy taking effect; Friedman's argument that discretionary policy often destabilises.",x:"Politik wirkt zu spät."},
 {t:"Natural rate hypothesis",de:"Hypothese der natürlichen Arbeitslosigkeit",ch:"s5",d:"Friedman and Phelps: any attempt to keep unemployment below a minimum level leads to ever-rising inflation; confirmed in the 1970s. Governments should keep unemployment stable around the natural rate.",x:"Langfristig kein Trade-off zwischen Inflation und Arbeitslosigkeit."},
 {t:"Rational expectations",de:"Rationale Erwartungen",ch:"s5",d:"Individuals and firms decide optimally using all available information; a government attempt to push unemployment down fails immediately. Lucas: monetary policy changes output only if it is a surprise.",x:"Neue Klassische Makroökonomie."},
 {t:"New classical macroeconomics",de:"Neue Klassische Makroökonomie",ch:"s5",d:"1970s-1980s evolution of the classical view: rational expectations and real business cycle theory.",x:"Robert Lucas."},
 {t:"Real business cycle theory",de:"Theorie realer Konjunkturzyklen",ch:"s5",d:"Business cycles are caused by fluctuations in productivity growth, not by demand shocks. Data indicate demand shocks also matter.",x:"Angebotsschocks als Ursache."},
 {t:"New Keynesian economics",de:"Neukeynesianismus",ch:"s5",d:"Influential in the 1990s: market imperfections make many prices temporarily sticky, so expected inflation cannot rise fast enough to offset activist policy.",x:"Starre Preise rechtfertigen Stabilisierungspolitik."},
 {t:"Political business cycle",de:"Politischer Konjunkturzyklus",ch:"s5",d:"Political use of macroeconomic policy to serve political ends: pump up the economy before an election, pay later with inflation or unemployment (Nixon 1972; Rogoff called him 'the all-time hero of political business cycles').",x:"Argument für unabhängige Zentralbanken."},
 {t:"Great Moderation",de:"Große Mäßigung",ch:"s5",d:"US period from 1985 to 2007 with relatively small fluctuations and low inflation; led to the belief that monetary policy could stabilise the economy.",x:"Endete mit der Finanzkrise 2008."},
 {t:"Fiscal policy",de:"Fiskalpolitik",ch:"s5",d:"Changing the level of government spending or taxes to achieve economic stability (Rumiche). After 2008 a revival of expansionary fiscal policy (fiscal stimulus).",x:"Staatsausgaben und Steuern."},
 {t:"Fiscal stimulus",de:"Konjunkturpaket / Fiskalischer Impuls",ch:"s5",d:"Expansionary fiscal policy: higher spending or lower taxes, leading to higher budget deficits.",x:"Nach 2008 wieder populär."},
 {t:"Austerity",de:"Sparpolitik (Austerität)",ch:"s5",d:"Attempts to reduce budget deficits by cutting spending and raising taxes. 2010-2013: the deeper the cuts, the worse the performance; each dollar of cuts reduced GDP by about 1.50 dollars.",x:"Siehe auch OCA-Kapitel bei Rumiche (Griechenland)."},
 {t:"Secular stagnation",de:"Säkulare Stagnation",ch:"s5",d:"A state in which the interest rate needed for full employment is consistently close to zero, caused by declining population growth and slow technological progress.",x:"Niedrigzinswelt."},
 {t:"Debt-to-GDP ratio",de:"Schuldenquote",ch:"s5",d:"Government debt relative to GDP. New view: what matters is the ratio, and if interest rates are below the growth rate it tends to shrink over time.",x:"Alte Sicht: Schulden, Zinsen, Defizite schaukeln sich hoch."},
 {t:"Automatic stabilizers",de:"Automatische Stabilisatoren",ch:"s5",d:"Tax and spending responses that help fight recessions even without new legislation (e.g. unemployment benefits, progressive taxes).",x:"Sollten bei Niedrigzinsen gestärkt werden."},
 {t:"Covid-19 recession",de:"Corona-Rezession",ch:"s5",d:"Very severe and very short US recession from February 2020 caused by the pandemic and public health response; rapid recovery with a surge in inflation. Lesson: the economy is less flexible in the short run than hoped.",x:"Kein normaler Konjunkturabschwung, AD-AS-Modell bleibt aber gültig."},
 // ---------- r1
 {t:"Arbitrage",de:"Arbitrage",ch:"r1",d:"Taking advantage of price differences across markets to make a profit; eventually prices that differed in two markets converge.",x:"Billig kaufen, teuer verkaufen, bis die Preisdifferenz verschwindet."},
 {t:"Purchasing power parity (PPP)",de:"Kaufkraftparität (KKP)",ch:"r1",d:"Compares currencies through a basket-of-goods approach; in the long run exchange rates should reflect the buying power of currencies for traded goods. Used to compare productivity and living standards.",f:"PPP rate = price of basket in country B / price of basket in country A",x:"Nach KKP liegt China mit 25.3 Bio. USD vor den USA mit 20.5 Bio. USD (Folie)."},
 {t:"Market exchange rate",de:"Marktwechselkurs",ch:"r1",d:"Conversion of GDP into a common currency using the actual market exchange rate; ignores differences in the cost of living.",x:"Folie: 1 USD = 64.76 Rupien; in Indien kauft man dafür Kaffee UND Sandwich."},
 {t:"Balassa-Samuelson effect",de:"Balassa-Samuelson-Effekt",ch:"r1",d:"Productivity-biased PPP: consumer prices are systematically higher in more developed countries, because arbitrage equalises only tradable prices, not non-tradable (stagnant productivity) prices.",x:"Dienstleistungen (Friseur) sind in reichen Ländern teurer."},
 {t:"Tradable goods",de:"Handelbare Güter",ch:"r1",d:"Goods that can be traded internationally; their prices align closely with nominal exchange rates.",x:"Gegenteil: nicht handelbare Güter und Dienstleistungen."},
 {t:"Non-tradable goods",de:"Nicht handelbare Güter",ch:"r1",d:"Goods and services that cannot be traded internationally (haircuts, rent); cheaper in low-income countries; prices closer to the PPP rate.",x:"Grund für den Balassa-Samuelson-Effekt."},
 {t:"Big Mac Index",de:"Big-Mac-Index",ch:"r1",d:"The Economist (since 1986) compares Big Mac prices across countries to see whether currencies are under- or overvalued. Slide: Germany USD 7.08 vs. Japan USD 3.08: yen undervalued, euro overvalued.",f:"implied PPP rate = Big Mac price in local currency / Big Mac price in reference currency",x:"35 USD reichen für 4.9 Big Macs in DE, 11.4 in JP. Diese 11.4 sind zu deutschen Preisen ca. 80 USD wert."},
 {t:"Big Mac Index drawbacks",de:"Schwächen des Big-Mac-Index",ch:"r1",d:"Price includes non-traded inputs like labor; McDonald's not in every country (Africa); only one item, lacks the diversity of a CPI. The Economist publishes a GDP-adjusted version.",x:"Drei Kritikpunkte merken."},
 {t:"Overvalued currency",de:"Überbewertete Währung",ch:"r1",d:"A currency whose market exchange rate is higher than its PPP rate: goods are expensive in that country (e.g. euro in the Big Mac example).",x:"Laut KKP müsste die Währung abwerten."},
 // ---------- r2
 {t:"Utility",de:"Nutzen",ch:"r2",d:"The total satisfaction a consumer receives from the consumption of a good or service.",x:"Nachfrage = Budget + Nutzenfunktion."},
 {t:"Willingness to pay",de:"Zahlungsbereitschaft",ch:"r2",d:"The maximum amount a buyer will pay for a good.",x:"Basis der Konsumentenrente."},
 {t:"Public goods",de:"Öffentliche Güter",ch:"r2",d:"Goods that are not excludable (people cannot be prevented from using them), available to everyone free of charge.",x:"Klassisch auch nicht rivalisierend (Lehrbuch)."},
 {t:"Free-rider problem",de:"Trittbrettfahrerproblem",ch:"r2",d:"Persons receive the benefit of a good but avoid paying for it; prevents private markets from supplying public goods. Government can provide them and finance with taxes.",x:"Wenn der Gesamtnutzen die Kosten übersteigt, sollte der Staat das Gut bereitstellen."},
 {t:"Externality",de:"Externer Effekt",ch:"r2",d:"Effect of private consumption or production decisions on third parties; positive (public goods) or negative (common resources); leads to inefficient allocation.",x:"Begründet Staatseingriffe."},
 {t:"Price discrimination",de:"Preisdiskriminierung",ch:"r2",d:"Selling the same good at different prices to different consumers. Requires market power, different consumer groups, and no resale.",x:"Drei Bedingungen."},
 {t:"Network externality",de:"Netzwerkexternalität",ch:"r2",d:"When each individual's demand depends on the purchases of other individuals (telephone).",x:"Positiv oder negativ."},
 {t:"Bandwagon effect",de:"Mitläufereffekt",ch:"r2",d:"Positive network externality: a consumer wishes to possess a good partly because others do (fashion).",x:"Nachfrage steigt mit der Zahl der Nutzer."},
 {t:"Snob effect",de:"Snob-Effekt",ch:"r2",d:"Negative network externality: a consumer wishes to own an exclusive or unique good; quantity demanded falls as more people own it.",x:"Seltene Kunst, Luxusautos."},
 {t:"Veblen good",de:"Veblen-Gut",ch:"r2",d:"Status good whose demand rises with price (status + network).",x:"Luxusgüter als Statussymbol."},
 {t:"Giffen good",de:"Giffen-Gut",ch:"r2",d:"Necessity whose demand rises when its price rises (necessity + network on the slide).",x:"Sehr seltener Ausnahmefall."},
 {t:"Tax wedge",de:"Steuerkeil",ch:"r2",d:"A tax drives a wedge between the price buyers pay and the price sellers receive. Ice cream: tax 0.50, buyers pay 3.30 instead of 3.00, sellers receive 2.80, quantity falls from 100 to 90.",x:"Beide Seiten tragen die Last, egal wer die Steuer abführt."},
 {t:"Tax incidence",de:"Steuerinzidenz",ch:"r2",d:"How the burden of a tax is shared between buyers and sellers; in the ice cream example buyers bear 0.30, sellers 0.20.",x:"Wer die Steuer wirtschaftlich trägt.",src:"added"},
 {t:"Price elasticity of demand",de:"Preiselastizität der Nachfrage",ch:"r2",d:"Percentage change in quantity demanded divided by percentage change in price. Differs along a linear demand curve (more elastic at high prices). Elasticity is a pure number.",f:"Ed = (change in Q / Q) / (change in P / P)",x:"Achtung: Auf den Folien steht teils ein %-Zeichen am Ergebnis, die Elastizität ist aber eine reine Zahl."},
 {t:"Midpoint method",de:"Mittelpunktmethode",ch:"r2",d:"Elasticity using average quantity and average price as the base, so the result is the same in both directions.",f:"Ed = (change in Q / average Q) / (change in P / average P)",x:"A nach B: (2/3)/(-1/8.5) = -5.67."},
 {t:"Elastic demand",de:"Elastische Nachfrage",ch:"r2",d:"Absolute elasticity greater than 1: quantity reacts more than proportionally to price.",x:"Viele Substitute, Luxus.",src:"added"},
 {t:"Isocost line",de:"Isokostenlinie",ch:"r2",d:"All combinations of labor and capital that can be bought for a given total cost C = wL + rK; K = C/r - (w/r)L; slope -(w/r).",f:"C = wL + rK",x:"Kostenminimierung der Firma."},
 {t:"Identity economics",de:"Identitätsökonomik",ch:"r2",d:"Case study: consumer choices are shaped by identity and social norms (black box of consumer behaviour), e.g. why Adidas prices differ by country.",x:"Fallstudie bei Rumiche."},
 // ---------- r3
 {t:"Not counted in GDP",de:"Was nicht ins BIP zählt",ch:"r3",d:"Intermediate goods, non-productive transactions (transfer payments, financial transactions, used products), non-market activities (illegal, home production, barter). Unsold inventory counts as investment.",x:"Gebrauchtwagenkauf zählt nicht, da nicht neu produziert."},
 {t:"Wealth effect",de:"Vermögenseffekt",ch:"r3",d:"Reason AD slopes down: when prices rise, the real value of people's assets falls, so they buy less.",x:"Höheres Preisniveau macht ärmer."},
 {t:"Interest rate effect",de:"Zinseffekt",ch:"r3",d:"Reason AD slopes down: with a fixed money supply higher prices raise money demand and the interest rate, so borrowing, consumption and investment fall.",x:"Mehr Geldbedarf, höhere Zinsen."},
 {t:"Net exports effect",de:"Außenhandelseffekt",ch:"r3",d:"Reason AD slopes down: as the domestic price level rises, foreign goods become relatively cheaper, imports rise and exports fall.",x:"Drittes Argument."},
 {t:"AD shifters",de:"Verschiebungsfaktoren der Nachfrage",ch:"r3",d:"AD increases with: stock market boom, more government spending, lower taxes, more money, higher consumer confidence, higher incomes of trading partners (and vice versa).",x:"Rechtsverschiebung erhöht Output und Preise (Inflation)."},
 {t:"Aggregate supply",de:"Gesamtwirtschaftliches Angebot",ch:"r3",d:"The quantity of real GDP supplied at different price levels. Short run: until input prices have risen in the same proportion as the price level.",x:"SRAS steigend, LRAS vertikal."},
 {t:"SRAS shifters",de:"Verschiebungsfaktoren des kurzfristigen Angebots",ch:"r3",d:"SRAS decreases with higher nominal wages, higher input prices, higher expected inflation; increases with new technology, lower taxes on producers, immigration (more labor).",x:"Angebotsschock nach links: Stagflation."},
 {t:"Long-run aggregate supply (LRAS)",de:"Langfristiges gesamtwirtschaftliches Angebot",ch:"r3",d:"Vertical: in the long run output does not depend on the price level; shifts with productive resources (labor, capital) and technology (natural level of real GDP).",x:"Nur Preise ändern sich langfristig bei Nachfrageschocks."},
 {t:"Multiplier effect",de:"Multiplikatoreffekt",ch:"r3",d:"Every euro of government spending raises GDP by more than a euro because spending becomes someone else's income (ALDI cashier, haircut, plane ticket...). Smaller if people save.",x:"Mehr Sparen = kleinerer Multiplikator."},
 {t:"Costs of inflation",de:"Kosten der Inflation",ch:"r3",d:"Financial wealth eroded, savings discouraged, resources misallocated, wealth redistributed from lenders to borrowers.",x:"Schuldner gewinnen, Gläubiger verlieren."},
 // ---------- r4
 {t:"Gross national product (GNP)",de:"Bruttonationaleinkommen / Bruttosozialprodukt",ch:"r4",d:"GDP plus net property income from abroad (dividends, interest, profits). Measures income of a country's residents.",f:"GNP = GDP + net income from abroad",x:"Japanischer Autobauer in UK: zählt zum UK-BIP, Gewinnrückführung nach Japan senkt das UK-BSP."},
 {t:"GDP vs. GNP (Ireland, Luxembourg)",de:"BIP vs. BSP",ch:"r4",d:"Countries with many multinationals that repatriate profits have GNP below GDP: Luxembourg GDP 87,400 vs. GNP 45,360; Ireland's GDP growth is 'clearly misleading'.",x:"BIP überzeichnet den Wohlstand."},
 {t:"Balance of payments (BOP)",de:"Zahlungsbilanz",ch:"r4",d:"Statement of all transactions between entities in one country and the rest of the world over a period. Consists of current account, capital account and financial account.",x:"Summe ist immer null (Ausgleich)."},
 {t:"Current account (CA)",de:"Leistungsbilanz",ch:"r4",d:"Exports + income receipts - imports - income payments - net transfers. CA > 0: surplus, nation is a net lender; CA < 0: deficit, net borrower.",f:"CA = EX(G,S,IPR,UT) - IM(G,S,IPR,UT)",x:"Güter, Dienstleistungen, Primäreinkommen, Übertragungen."},
 {t:"Income receipts",de:"Empfangene Primäreinkommen",ch:"r4",d:"Money earned by domestic residents on their investments abroad (dividends, interest). German company bringing home profits from a Turkish plant.",x:"Plus in der Leistungsbilanz."},
 {t:"Income payments",de:"Geleistete Primäreinkommen",ch:"r4",d:"Money earned by foreign residents on their investments in the country. British company taking profits home from a Frankfurt office building.",x:"Minus in der Leistungsbilanz."},
 {t:"Unilateral transfers",de:"Laufende Übertragungen",ch:"r4",d:"Payments without an offsetting product flow: remittances, foreign aid (Germany: 23.8 billion USD ODA in 2019, 0.60% of GNI).",x:"Geld fließt, nichts kommt zurück."},
 {t:"Remittances",de:"Rücküberweisungen",ch:"r4",d:"Money a person in one country transfers to a relative in another country, receiving nothing in return.",x:"Gastarbeiter schicken Geld heim."},
 {t:"Financial account (KA)",de:"Kapitalbilanz (Finanzierungsbilanz)",ch:"r4",d:"Records all international trade in assets (bonds, T-bills, stocks, deposits, real estate, currency, FDI, SDRs). KA = exports of assets - imports of assets; KA > 0 surplus.",f:"KA = EXA - IMA",x:"Asset-Export = Inländer verkaufen Vermögen an Ausländer (Kapitalzufluss)."},
 {t:"Capital inflow",de:"Kapitalzufluss",ch:"r4",d:"Foreigners lend to domestic citizens by acquiring domestic assets (credit +): Turk buys your Frankfurt flat, Chinese central bank buys a Bund.",x:"Plus in der Kapitalbilanz."},
