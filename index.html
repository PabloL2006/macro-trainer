Question: ${q.q}
Model answer: ${q.a}
Key points expected: ${q.k.join("; ")}
Student answer: """${ans}"""
Grade fairly like a university examiner: content and correct use of terms matter, language mistakes do not. Wording may differ from the model answer. Do not reward content that is wrong.
Return JSON only, with this shape: {"score": integer 0 to 10, "covered": [short strings], "missing": [short strings, include errors], "feedback": "2 to 3 sentences in English", "feedback_de": "1 to 2 sentences in German"}.
Use only plain characters: straight quotes, normal hyphens, no arrows.`;
    try{
      const v=await sampleFn.json(prompt,{modelTier:"default"});
      const sc=Math.max(0,Math.min(10,Math.round(+v.score||0))); claudeScore=Math.round(sc)/10;
      fb.innerHTML=`<section class="claude-fb"><div class="score"><b>${sc}/10</b>${bar(sc/10)}</div>
        ${v.covered&&v.covered.length?`<h4>Covered</h4><ul class="ok-l">${v.covered.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
        ${v.missing&&v.missing.length?`<h4>Missing or wrong</h4><ul class="miss-l">${v.missing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
        <p>${esc(v.feedback||"")}</p>${v.feedback_de?`<p class="dex">${esc(v.feedback_de)}</p>`:""}</section>`;
      showModel();
    }catch(err){ fb.innerHTML=`<p class="warn-t">${err&&err.code==="rate_limited"?"Too many requests right now. Compare with the model answer instead.":"Grading did not work this time. Compare with the model answer instead."}</p>`; $("#oClaude").disabled=false; }
  };
}
// ---- calc item
function parseNum(s){ s=String(s).trim().replace(/[%$€\s]|EUR|USD|bn|m/gi,""); if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,""); else s=s.replace(",","."); return s===""?NaN:Number(s); }
function runCalc(box,it,done){
  const c=it.ref, p=c.gen();
  box.innerHTML=`<article class="panel"><div class="kind">Calculation - ${esc(c.name)} - ${esc(chLabel(c.ch))}${it.pts?` - ${it.pts} points`:""}</div>
    <p class="qtext">${esc(p.q)}</p>
    ${p.choices? `<div class="opts" id="kOpts">${p.choices.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("")}</div>`
      : `<form id="kForm" class="ans-row"><label class="fl" for="kIn">Your result${p.unit?` (${esc(p.unit)})`:""}</label><input id="kIn" inputmode="decimal" autocomplete="off" placeholder="e.g. 4.25"><button class="btn primary" type="submit">Check</button></form>`}
    <div id="kFb" aria-live="polite"></div></article>`;
  const finish=(ok,given)=>{
    rateBox(S.calc,c.id,ok);
    const right = p.choices? p.choices[p.ans] : nf(p.ans,p.dp)+(p.unit&&p.unit!=="$"?" "+p.unit:"");
    $("#kFb").innerHTML=`<section class="${ok?"res ok":"res bad"}"><b>${ok?"Correct.":"Not quite."}</b> ${ok?"":`Correct answer: <b>${esc(right)}</b>`}
      <h4>Solution</h4><ol class="steps">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="row"><button class="btn primary" id="kNext">Next</button></div></section>`;
    $("#kNext").onclick=()=>done(ok?1:0); $("#kNext").focus();
  };
  if(p.choices){ $("#kOpts").onclick=e=>{const b=e.target.closest("[data-i]"); if(!b||b.disabled) return; const i=+b.dataset.i; [...$("#kOpts").children].forEach((x,j)=>{x.disabled=true; if(j===p.ans) x.classList.add("right"); else if(j===i) x.classList.add("wrong");}); finish(i===p.ans);}; }
  else { $("#kIn").focus(); $("#kForm").onsubmit=e=>{ e.preventDefault(); const v=parseNum($("#kIn").value); if(isNaN(v)){ $("#kFb").innerHTML=`<p class="warn-t">Enter a number, for example 4.25 or -1.5.</p>`; return; } const tol=Math.max(Math.abs(p.ans)*0.011, Math.pow(10,-p.dp)*0.6, 0.011); const ok=Math.abs(v-p.ans)<=tol; $("#kIn").disabled=true; $("#kForm").querySelector("button").disabled=true; finish(ok,v); }; }
}
// ---- graph item
function runGraph(box,it,done){
  const g=it.ref, d=DG[g.g]; const order=shuffle(g.o.map((x,i)=>i));
  box.innerHTML=`<article class="panel"><div class="kind">Graph - ${esc(d.t)}${it.pts?` - ${it.pts} point`:""}</div>
    <div class="dg-wrap">${d.svg()}</div><p class="qtext">${esc(g.q)}</p>
    <div class="opts" id="gOpts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(g.o[i])}</button>`).join("")}</div><div id="gFb" aria-live="polite"></div></article>`;
  $("#gOpts").onclick=e=>{const b=e.target.closest("[data-i]"); if(!b||b.disabled) return; const i=+b.dataset.i, ok=i===g.c;
    [...$("#gOpts").children].forEach(x=>{x.disabled=true; const j=+x.dataset.i; if(j===g.c) x.classList.add("right"); else if(j===i) x.classList.add("wrong");});
    rateBox(S.g,g.id,ok);
    $("#gFb").innerHTML=`<section class="${ok?"res ok":"res bad"}"><b>${ok?"Correct.":"Not quite."}</b> ${esc(g.e)}<div class="row"><button class="btn primary" id="gNext">Next</button></div></section>`;
    $("#gNext").onclick=()=>done(ok?1:0); $("#gNext").focus();
  };
}

// ================= boot =================
(function boot(){
  const loc=loadLocal(); if(loc) S=loc;
  const h=location.hash.slice(1); if(VIEWS.some(v=>v.id===h)) view=h;
  render();
  initSample().then(()=>{ if(!runner) render(); });
  initCloud();
})();

</script>
