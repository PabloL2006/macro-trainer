const EXQ = [
 {ch:"s0",q:"Pick two of the ten principles of economics. Explain each with an example and say what purpose it serves.",
  a:"Principle 2, 'the cost of something is what you give up to get it': every choice has an opportunity cost, the value of the best alternative given up. Example: the opportunity cost of a lecture is the wage from a shift you could have worked, not the tuition you already paid (sunk). Purpose: it makes people and governments compare alternatives instead of looking only at money prices. Principle 5, 'trade can make everyone better off': when people or countries specialise in what they do at the lowest opportunity cost and trade, both can consume more than alone. Example: Frank and Rose, or Germany (planes) and France (ships). Purpose: it explains why specialisation and open markets raise living standards. Other good choices: Principle 4 (people respond to incentives, gasoline from 2 to 4 dollars, people drove less) or Principle 9 (prices rise when the government prints too much money).",
  k:["name the principle correctly","explain the idea in own words","concrete example","purpose: what the principle helps us understand or decide"]},
 {ch:"r6",q:"(a) Why and how could a country produce at a point inside its PPF? (b) How can it reach a point C outside the PPF if the frontier is the most it can produce?",
  a:"(a) The PPF shows the maximum output when all resources are fully and efficiently used. A point inside (Z) means resources are idle or misused: unemployment in a recession, factories standing still, strikes, war or a pandemic (Covid shutdown), bad allocation (workers in the wrong jobs), weak institutions. The economy could then produce more of both goods without giving anything up. (b) A point outside (W) is unattainable with today's resources and technology. It becomes reachable in two ways. First, the frontier shifts out: more resources (more workers, immigration, more capital through investment, new raw materials) or better technology and productivity. Second, through trade: a country specialises according to its comparative advantage and trades, so it can consume a combination outside its own PPF even though it cannot produce it (Frank and Rose consume at A* and B*).",
  k:["inside = unemployment / idle or inefficient resources, with example","outside = unattainable with current resources and technology","PPF shifts out: more resources or better technology","trade lets a country consume outside its PPF"]},
 {ch:"r7",q:"What does autarky mean? Show what it looks like in a PPF and in a market diagram for one good.",
  a:"Autarky is complete self-sufficiency: an economy that does not take part in international trade and receives no outside support (examples on the slides: North Korea, Nazi Germany). In the PPF view, the country can only consume what it produces itself, so its consumption point lies on its own PPF (in the H-O slides at the autarky point where the indifference curve touches the PPF). In a supply and demand diagram for one good, the price and quantity are set only by domestic supply and domestic demand: the autarky equilibrium A where the two curves cross. When trade opens, the world price replaces the autarky price: below it the country imports, above it the country exports.",
  k:["definition: no trade, self-sufficient","example (North Korea)","PPF: consumption = own production on the frontier","market diagram: equilibrium of domestic S and D (point A)","with trade the world price replaces the autarky price"]},
 {ch:"r6",q:"Japan can produce 4 laptops or 12 phones, Brazil 1 laptop or 5 phones (same resources). Calculate the opportunity costs, find the comparative advantages and a terms of trade that benefits both.",
  a:"Opportunity cost of 1 laptop: Japan 12/4 = 3 phones, Brazil 5/1 = 5 phones. Opportunity cost of 1 phone: Japan 4/12 = 1/3 laptop, Brazil 1/5 = 0.2 laptop. Japan has the absolute advantage in both goods, but the comparative advantage in laptops (3 < 5 phones). Brazil has the comparative advantage in phones (0.2 < 0.33 laptop). Japan should specialise in laptops, Brazil in phones. Terms of trade: the price of one laptop must lie between the two opportunity costs, more than 3 and less than 5 phones. Example: 1 laptop = 4 phones. Japan then gets 4 phones per laptop instead of 3, Brazil pays 4 phones instead of 5, so both gain.",
  k:["laptop: Japan 3 phones, Brazil 5 phones","phone: Japan 1/3, Brazil 1/5 laptop","Japan absolute advantage in both","comparative advantage: Japan laptops, Brazil phones","terms of trade between 3 and 5 phones per laptop, e.g. 4"]},
 {ch:"r8",q:"Describe, defend and explain international trade from an economic point of view.",
  a:"Describe: trade means countries buy and sell goods, services and assets across borders. Explain: following Ricardo, each country specialises in what it produces at the lowest opportunity cost (comparative advantage). Total output rises and both partners can consume outside their own PPF; trade is not zero-sum. Heckscher-Ohlin adds that countries export goods that use their abundant factor intensively. Defend: specialisation uses resources more efficiently; consumers get lower prices and more variety; total surplus rises when a country opens to trade (in an importing country consumers gain more than producers lose); competition and economies of scale raise productivity. Limits to mention: transport costs, structural unemployment in shrinking sectors, losers such as low-skilled workers (H-O), which is why many economists favour free trade combined with help for those who lose.",
  k:["comparative advantage and specialisation","both sides gain, consume beyond own PPF","gains in total surplus / lower prices, variety","some groups lose: structural unemployment, compensation"]},
 {ch:"r8",q:"Should a country always impose tariffs? Why is having no tariff an issue for the government, and would removing tariffs increase GDP?",
  a:"No. A tariff raises the domestic price above the world price: consumers lose consumer surplus, domestic producers gain some producer surplus, the government earns tariff revenue, but two deadweight-loss triangles remain (inefficient domestic production and consumption that no longer happens). Total surplus falls, and partners may retaliate. Arguments used for tariffs: protect domestic jobs, infant industry, diversity of production, prevent dumping, national security; economists see most of these as weak or better solved otherwise. Why no tariff is an issue for the government: it loses tariff revenue, and domestic producers in the import-competing industry lose sales and jobs, which creates political pressure. Effect on GDP: removing the tariff raises total surplus and efficiency, and cheaper imported inputs can raise production elsewhere, but domestic production of that good falls. The welfare gain is clear, the effect on measured GDP is not automatic.",
  k:["tariff: CS falls, PS and revenue rise, deadweight loss","arguments for protection (jobs, infant industry, dumping)","no tariff: government loses revenue, domestic producers and jobs under pressure","removing tariffs raises total surplus; GDP effect not automatic"]},
 {ch:"r8",q:"Regarding tariffs: explain consumer surplus and producer surplus on the graph. Who gains producer surplus, and how?",
  a:"Consumer surplus is willingness to pay minus the price paid: the area below the demand curve and above the price. Producer surplus is the price received minus the cost of production: the area above the supply curve and below the price. With free trade at the world price, consumers enjoy a large consumer surplus and domestic producers a small producer surplus, and imports fill the gap. A tariff raises the domestic price. Domestic producers gain producer surplus (area A in the graph) because they sell more units at a higher price. Consumers lose A + B + C + D because they pay more and buy less. The government receives C (tariff times imports). B and D are lost to everybody: the deadweight loss. Foreign producers sell less into the market.",
  k:["CS: below demand, above price","PS: above supply, below price","tariff: domestic producers gain A","consumers lose A+B+C+D, revenue C, DWL B+D"]},
 {ch:"r4",q:"If we all buy from China, shouldn't the yuan be the most powerful currency in the world?",
  a:"Buying Chinese goods does raise the demand for yuan: importers must pay in yuan. But a currency's value depends on more than trade. First, China recycles its trade surplus: the People's Bank of China and Chinese investors use the earned dollars and euros to buy foreign assets, for example US Treasuries or German Bunds (slide 68). This creates demand for dollars and euros and balances the current account surplus with a financial account outflow. Second, China has managed its exchange rate and kept the yuan undervalued to keep exports cheap; this is possible because it holds huge foreign exchange reserves. Third, demand for a currency also comes from capital flows, interest rates, trust and reserve-currency status: the dollar is the world's main reserve and invoicing currency, while the yuan is less freely convertible because of capital controls. A strong currency would also make Chinese exports more expensive, which China does not want.",
  k:["imports from China raise demand for yuan","China buys foreign assets with its surplus (Treasuries, Bunds): financial account","managed / undervalued yuan, foreign reserves","currency value also driven by capital flows, interest rates, reserve status, capital controls"]},
 {ch:"r4",q:"What do countries do with a surplus or a deficit from exports and imports?",
  a:"The balance of payments always balances: current account + capital account + financial account = 0. A country with a current account surplus (Germany, China) earns more foreign currency than it spends. It lends the difference to the rest of the world: it buys foreign assets such as bonds, shares, real estate, or the central bank adds to its foreign exchange reserves. It is a net lender (financial account outflow). A country with a current account deficit (USA) must finance it: it sells assets to foreigners or borrows from abroad, so foreign money flows in on the financial account. It is a net borrower. US example (2011): current account about -710 bn, financed by a financial account of about +710 bn (foreign purchases of US assets 2050 bn minus US purchases abroad 1300 bn, minus 60 bn change in official reserves). If a deficit country cannot attract enough capital, the supply of its currency exceeds demand and it depreciates, which makes exports cheaper and reduces the deficit over time.",
  k:["BOP balances: CA + financial account","surplus: buys foreign assets / reserves, net lender","deficit: sells assets or borrows, net borrower","example USA -710 / +710","no capital inflow: currency depreciates"]},
 {ch:"r5",q:"Why would the demand for Mexican pesos increase in the USA?",
  a:"Americans need pesos whenever they buy something Mexican. Demand rises if: (1) Americans import more Mexican goods or travel more to Mexico (taste, cheaper prices, higher US incomes); (2) interest rates or returns in Mexico rise relative to the US, so investors buy Mexican assets; (3) investors expect the peso to appreciate, so they buy now to profit later (slide: demand shifts from D0 to D1, the rate rises from 10 to 12 cents per peso and the quantity from 85 to 90 bn pesos); (4) Mexico has lower inflation than the US, so the peso keeps its purchasing power; (5) more US direct investment in Mexico, or political and economic stability in Mexico. Result: the demand curve for pesos shifts right and the peso appreciates against the dollar.",
  k:["more imports / tourism from Mexico","higher relative interest rates or returns in Mexico","expected appreciation (speculation)","lower relative inflation / stability","demand curve shifts right, peso appreciates"]},
 {ch:"r5",q:"How can the supply of euros on the FOREX market decrease?",
  a:"Euros are supplied by people who hold euros and want another currency: Europeans who import, travel abroad or buy foreign assets. Supply falls when they do less of that: (1) EU imports fall, for example because of a recession in Europe, lower incomes or tariffs on foreign goods; (2) fewer Europeans travel abroad; (3) ECB interest rates rise or foreign rates fall, so Europeans keep their savings in euro assets instead of buying foreign bonds; (4) Europeans expect the euro to appreciate and are less willing to give euros up (slide 83: the supply curve shifts left from S0 to S1); (5) lower inflation and more stability in the euro area. A leftward shift of the supply curve raises the value of the euro.",
  k:["supply comes from euro holders buying foreign goods, travel, assets","fewer imports / less travel","higher euro interest rates or lower foreign rates","expected euro appreciation","supply shifts left, euro appreciates"]},
 {ch:"s4",q:"What event would have to happen for us euro users to hold on to our euros (as cash) and not put them in the bank?",
  a:"Interpretation: when does holding cash become as good as or better than a bank deposit? People deposit money to earn interest and for safety. They hold cash instead when (1) interest rates are zero or negative: the ECB's deposit rate was negative from 2014 to 2022 and some banks charged fees on large deposits, so the opportunity cost of holding cash fell to zero; (2) there is deflation: falling prices raise the real value of cash, so simply holding it gains purchasing power; (3) trust in banks is lost, for example in a banking crisis (fear of a bank run, Greece 2015 or Cyprus 2013 with capital controls). Link to the slides: the interest rate is the price of money, and money as a store of value works best when prices are stable. If the question means holding euros instead of exchanging them into another currency, the answer is: the euro must be expected to keep or gain value, for example through higher ECB interest rates, low inflation and stability.",
  k:["opportunity cost of cash = interest","zero / negative interest rates (ECB 2014-2022)","deflation raises real value of cash","loss of trust in banks","alternative reading: expected euro stability / appreciation"]},
 {ch:"s2",q:"What is inflation, why do prices go up, and how can the causes be classified?",
  a:"Inflation is a sustained increase in the general price level, so each euro buys less. It is measured by the change in a price index: inflation rate = (CPI this year - CPI last year) / CPI last year x 100 (or with the GDP deflator). Causes: (1) Demand-pull inflation: aggregate demand grows faster than the economy can produce (boom, lower taxes, higher government spending, cheap credit); the AD curve shifts right. (2) Cost-push inflation: input prices rise (energy, oil, raw materials, wages), firms pass the costs on; the short-run AS curve shifts left (for example the 2022 energy price shock). (3) Monetary cause: the central bank lets the money supply grow faster than output (Principle 9: prices rise when the government prints too much money; Argentina). (4) Expectations / wage-price spiral: if people expect inflation, workers demand higher wages and firms raise prices. Effects (project slide 47): financial wealth is eroded, saving is discouraged, resources are misallocated, wealth is redistributed from lenders to borrowers.",
  k:["definition: sustained rise in the general price level","measured by CPI or deflator, formula","demand-pull (AD right)","cost-push (input prices, SRAS left)","too much money (Principle 9)","expectations / wage-price spiral","effects on savers, lenders, borrowers"]},
 {ch:"s2",q:"Why do we need some inflation at all? Why does the ECB aim for about 2 % and not 0 %?",
  a:"The ECB's goal is price stability, on the slides 'inflation below, but close to, 2 % over the medium term' (since its 2021 strategy review the ECB says a symmetric 2 %). A small positive rate is preferred to zero because: (1) it keeps a safety margin against deflation, which is dangerous: people postpone purchases, the real burden of debt rises, firms cut jobs; (2) it gives the central bank room to cut interest rates in a recession (nominal rates cannot fall far below zero); (3) it makes wages more flexible: real wages can fall slightly without cutting nominal wages, which workers resist (downward rigid wages); (4) the CPI overstates true inflation (substitution bias, quality change, new goods), so measured 0 % could be real deflation. Too much inflation is also harmful, so the target is low but positive.",
  k:["ECB target: below but close to 2 % (now symmetric 2 %)","buffer against deflation and its damage","room for interest rate cuts","real wages can adjust without nominal cuts","CPI overstates inflation"]},
 {ch:"r3",q:"What would happen to unemployment if prices went down? Explain from the point of view of all actors, not only consumers.",
  a:"It depends on why prices fall. Case 1, falling demand (AD shifts left, deflation): consumers postpone purchases because things will be cheaper later; firms sell less and their revenue falls, but wages are sticky downward, so real wages rise and firms cut jobs; borrowers (households, firms, the government) face a higher real debt burden and cut spending and investment; banks get more defaults and lend less; the government earns less tax and pays more unemployment benefits. Result: output falls and unemployment rises (cyclical unemployment), as in the Great Depression. Case 2, cheaper inputs or better technology (SRAS shifts right, for example lower energy prices): firms can produce more at lower cost, real incomes rise, output grows and unemployment falls. In the exam, name the case and walk through consumers, firms, workers, banks and government.",
  k:["distinguish cause: AD falls vs. SRAS shifts right","consumers postpone purchases","firms: lower revenue, sticky wages, layoffs","debt burden rises, banks lend less","government: lower taxes, higher benefits","positive supply shock: lower prices and lower unemployment"]},
 {ch:"r3",q:"Define the following terms: interest rate, inflation, recession, input prices, aggregate demand.",
  a:"Interest rate: the price of borrowing money (or the return on saving), expressed as a percentage of the amount per year; key rates are set by the central bank (ECB). Inflation: a sustained increase in the general price level, so money loses purchasing power. Recession: a period of declining real income and rising unemployment; a common rule is two consecutive quarters of falling real GDP. Input prices: the prices of the factors of production firms use, such as wages, energy, raw materials and rents; higher input prices shift the short-run aggregate supply curve to the left. Aggregate demand: the total demand for all final goods and services in an economy at each price level, AD = C + I + G + (X - M), demanded by households, firms, the government and foreigners; it slopes downward because of the wealth, interest rate and net exports effects.",
  k:["interest rate = price of money / borrowing","inflation = sustained rise in price level","recession = falling real GDP, rising unemployment (2 quarters rule)","input prices = prices of factors of production, shift SRAS","AD = C + I + G + NX at each price level"]},
 {ch:"r9",q:"What happens when the ECB increases or decreases interest rates, and what is it signalling about the economy?",
  a:"The ECB's key rates (MRO rate, deposit facility rate, marginal lending facility rate) are the rates at which banks borrow from or deposit with the central bank, so they steer interbank rates and then the rates for loans and savings. Increase: credit becomes more expensive and saving more attractive, so consumption and investment fall, aggregate demand and inflation fall; higher returns attract foreign capital, the euro appreciates, exports become more expensive and imports cheaper; growth slows and unemployment can rise. Signal: inflation is too high or the economy is overheating, and the ECB is determined to keep prices stable. Decrease: credit gets cheaper, the money supply, consumption, investment and AD rise; capital flows out, the euro tends to depreciate, exports get cheaper. Signal: the economy is weak or heading for recession and inflation is low, so the ECB wants to stimulate. Decisions are taken by the Governing Council every six weeks.",
  k:["key rates: MRO, deposit facility, marginal lending; steer interbank and loan rates","increase: C, I, AD down, inflation down","increase: capital inflow, euro appreciates, exports dearer","decrease: the opposite, stimulus","signal: overheating / inflation vs. weak economy / recession risk"]},
 {ch:"r9",q:"Explain monetary policy and fiscal policy. Name three monetary policy instruments and two fiscal policy instruments.",
  a:"Monetary policy: changes in the money supply and interest rates by the central bank to fight recessions or inflation; in the euro area it is set by the ECB with the primary objective of price stability. Three instruments of the Eurosystem: (1) open market operations, especially the main refinancing operations (MRO) through which banks get liquidity; (2) standing facilities: the deposit facility and the marginal lending facility, which set the floor and ceiling for overnight rates; (3) minimum reserve requirements: the share of deposits banks must hold at the central bank. (Since 2015 also large asset purchases, quantitative easing.) Fiscal policy: changes in government spending or taxes by the government (in Germany the federal government and parliament) to stabilise the economy. Two instruments: (1) government spending, for example infrastructure; (2) taxes, for example income tax or VAT cuts (plus transfers such as unemployment benefits). Through the multiplier, one euro of spending raises GDP by more than a euro, but less if people save the money or if the state must borrow.",

const SHEET = [{"id": "sec00", "title": "How to use this sheet", "md": "This sheet sums up both slide decks for the written exam on Friday, 13 November, sorted by topic instead of by deck. Topics that appear in both decks are merged, so you read them once.\n\n- **Sources:** \"Lecture\" = Prof. Schubert, Macroeconomics (chapters 00 to 05). \"Project\" = J. Enrique Rumiche, Slides for Project (chapters 00 to 10).\n- **Facts:** definitions, formulas, numbers and examples come from the slides.\n- **Not on the slides:** a few textbook additions are marked *(textbook)*.\n- **Language:** English like the exam, German terms in brackets.\n\nRead one section, then practise it right away. That sticks better than reading everything first.", "ch": []}, {"id": "sec01", "title": "1. Basics (Lecture 00)", "md": "Economics is the study of choices under scarcity (Knappheit): society cannot produce everything people want, so every choice has a cost.\n\n**Micro vs. macro.** Microeconomics looks at households, firms and single markets. Macroeconomics looks at the whole economy: inflation, unemployment and growth.\n\n**The 10 Principles**\n\n| Group | Principle |\n| --- | --- |\n| How people decide | 1 People face trade-offs (Zielkonflikt): guns vs. butter, efficiency vs. equality |\n| | 2 The cost of something is what you give up: opportunity cost (Opportunitätskosten) |\n| | 3 Rational people think at the margin: act only if marginal benefit > marginal cost; ignore sunk costs |\n| | 4 People respond to incentives (Anreize): gasoline from about $2 to $4 a gallon, so people drove less |\n| How people interact | 5 Trade can make everyone better off |\n| | 6 Markets are usually a good way to organise activity (Adam Smith's invisible hand) |\n| | 7 Governments can sometimes improve outcomes: property rights, market failure, equality |\n| How the economy works | 8 Living standards depend on productivity |\n| | 9 Prices rise when the government prints too much money |\n| | 10 Short-run trade-off between inflation and unemployment |\n\n**Thinking like an economist**\n\n- **Models** simplify reality with assumptions, like a map.\n- **Ceteris paribus** (unter sonst gleichen Bedingungen): change one variable, hold everything else constant.\n- **Exogenous** variables come from outside the model; **endogenous** variables are explained by the model.\n- **Circular flow** (Wirtschaftskreislauf): households buy goods from firms and sell them labor, land and capital. Outer arrows = money, inner arrows = goods and inputs.\n- **PPF** (Produktionsmöglichkeitenkurve): points on the curve are efficient, inside inefficient, outside not feasible. The slope is the opportunity cost. It is bowed outward because resources are specialised. Technological progress shifts it outward (growth).\n- **Positive** = what is, testable. **Normative** = what ought to be, value judgment.\n- **Why economists disagree:** different scientific judgments, different values (Peter and Paula's well tax), perception vs. reality (rent control, tariffs).\n- **Graph traps:** an omitted variable (lighters and cancer: cigarettes) and reverse causality (police and crime).", "ch": ["s0"]}, {"id": "sec02", "title": "2. Trade (Lecture 01, Project 05 to 08)", "md": "Specialising by comparative advantage and trading makes both sides better off, so trade is not a zero-sum game.\n\n**Absolute vs. comparative advantage**\n\n- **Absolute advantage** (absoluter Vorteil): producing with fewer inputs.\n- **Comparative advantage** (komparativer Vorteil): producing at a lower opportunity cost. One person can have the absolute advantage in both goods, but never the comparative advantage in both.\n- **Opportunity cost per unit** = what you give up / what you gain.\n- **Price of trade / terms of trade:** must lie between the two opportunity costs.\n\n| Example | Numbers | Result |\n| --- | --- | --- |\n| Frank and Rose (Lecture) | Rose: 20 min per oz meat, 10 min per oz potatoes. Frank: 60 and 15 min | Rose: 1 meat costs 2 potatoes, Frank: 4. Rose specialises in meat, Frank in potatoes. Trade 5 meat for 15 potatoes (3 per meat, between 2 and 4) |\n| Germany and France (Project) | Germany 2000 planes or 200 ships, France 1200 planes or 200 ships | 1 plane costs Germany 0.1 ship, France 0.167. Germany: planes, France: ships. 1 ship between 6 and 10 planes |\n| Leonardo and Forrest | Leo: mowing costs $20,000 (commercial), Forrest: $40 (McDonald's) | Forrest mows, Leo films; pay between $40 and $20,000 |\n\n**Sources of comparative advantage:** climate, factor endowments (Faktorausstattung), technology. Increasing returns to scale also drive trade (aircraft: Seattle and Toulouse). Hong Kong lost its advantage in garments because it got better at other things.\n\n**Heckscher-Ohlin model** (2 countries, 2 goods, 2 factors): a country exports goods that use its abundant factor intensively. Abundance means the ratio K/L, not the total. Assumptions: same technology, same preferences. Effect on wages: the abundant factor gains, the scarce factor loses (US: skilled wages up, unskilled down, more inequality).\n\n**Leontief paradox:** the capital-rich US exported labor-intensive goods. Solved by splitting labor into skilled and unskilled.\n\n**Opening to trade**\n\n| | Importing country (Pw below PA) | Exporting country (Pw above PA) |\n| --- | --- | --- |\n| Price | falls to Pw | rises to Pw |\n| Consumers | gain X + Z | lose X |\n| Producers | lose X | gain X + Z |\n| Total surplus | + Z | + Z |\n| Trade volume | imports = QD - QS | exports = QS - QD |\n\n**Tariff** (Zoll, a tax on imports): the price rises to Pw + t, domestic production rises, consumption and imports fall.\n\n- Consumer surplus: - (A + B + C + D)\n- Producer surplus: + A\n- Government revenue: + C\n- **Deadweight loss** (Wohlfahrtsverlust): B + D. B = wasted resources in inefficient domestic production, D = purchases that no longer happen.\n\n**Import quota** (Einfuhrquote): same effects, but area C goes to license holders as \"quota rents\", usually foreigners.\n\n**Tariff types:** specific (3 EUR per barrel), ad valorem (12% on textiles), compound (wine: 21 or 35 EUR per kg).\n\n**Trade policy instruments:** reduce trade with tariffs, export taxes, quotas and VERs; increase trade with export or import subsidies and VIE.\n\n**Arguments for protection and the critique**\n\n- National security: self-sufficiency in crucial goods.\n- Jobs: often offset by jobs lost elsewhere.\n- Infant industry: often goes to politically strong industries; governments pick winners badly.\n- Also on Project slides: diversity of production, prevent dumping.", "ch": ["s1", "r6", "r7", "r8"]}, {"id": "sec03", "title": "3. Measuring the economy (Lecture 02, Project 01 to 02)", "md": "GDP measures total income and total expenditure; prices are measured with the CPI or the GDP deflator.\n\n**GDP** (BIP) = the market value of all final goods and services produced within a country in a given period.\n\n- Market value: valued at market prices.\n- All: legally sold in markets; no home production, no illegal activity.\n- Final: no intermediate goods (Vorleistungen), otherwise double counting.\n- Produced: newly produced only; used goods do not count.\n- Within a country: regardless of the owner's nationality.\n\n**Y = C + I + G + NX** (Germany 2024: C 53%, I 21%, G 22%, NX 4% of 4,329 bn EUR)\n\n| Component | Includes | Watch out |\n| --- | --- | --- |\n| C Consumption | household spending | new houses are NOT C |\n| I Investment | equipment, structures, inventories, new houses | unsold inventory counts as I |\n| G Government purchases | goods and services of all levels of government | transfer payments are NOT included |\n| NX Net exports | exports - imports | NX < 0 = trade deficit |\n\n**Not in GDP** (Project): intermediate goods, transfer payments, financial transactions, used goods, home production, illegal activity, barter.\n\n**Nominal vs. real GDP:** nominal = current prices, real = base-year prices. In the base year they are equal. Growth is measured with real GDP.\n\n**GDP deflator** = nominal GDP / real GDP x 100. It is 100 in the base year.\n\n**GDP as a welfare measure:** best single measure (income, health, education correlate with it: UK vs. Mexico vs. Mali), but it ignores leisure, home production, the shadow economy, the environment and distribution.\n\n**CPI** (Verbraucherpreisindex) in 5 steps\n\n1. Fix the basket (weights = relative importance).\n2. Find the prices for each year.\n3. Compute the cost of the same basket each year.\n4. CPI = cost this year / cost in base year x 100.\n5. Inflation = (CPI year 2 - CPI year 1) / CPI year 1 x 100.\n\nSlide example: 4 hot dogs + 2 hamburgers cost $8, $14, $20. CPI 100, 175, 250. Inflation 75% and 43%.\n\n**Why the CPI overstates the cost of living**\n\n- Substitution bias: people switch to goods that got relatively cheaper.\n- New goods: cell phones from 1983, in the CPI only from 1998.\n- Unmeasured quality change.\n\n**Deflator vs. CPI:** the deflator covers all goods produced domestically (incl. investment goods); the CPI covers a fixed consumer basket (incl. imports). Both usually move together. The PPI (Erzeugerpreisindex) measures prices paid by firms and often predicts the CPI.\n\n**Real vs. nominal:** what counts is purchasing power. Real interest rate = nominal rate - inflation. Indexation and COLAs adjust payments to the CPI automatically.\n\n**GNP** (Bruttonationaleinkommen) = GDP + net income from abroad (dividends, interest, profits). A Japanese car plant in the UK raises UK GDP; profits sent to Japan lower UK GNP. Luxembourg: GDP 87,400 vs. GNP 45,360. Ireland's GDP is \"misleading\" because of multinationals.", "ch": ["s2", "r3"]}, {"id": "sec04", "title": "4. Growth and unemployment (Lecture 03)", "md": "Living standards grow with productivity; unemployment is measured against the labor force, not the population.\n\n**Growth**\n\n- Measured as growth of real GDP per person. Rule of 70: income doubles in 70 / growth rate years (2% gives 35 years).\n- **Productivity** (Produktivität) = output per unit of labor. Determinants: physical capital, human capital, natural resources, technological knowledge.\n- **Diminishing returns** (abnehmende Grenzerträge): each extra unit of capital adds less output. A higher saving rate raises the level of income, not the long-run growth rate.\n- **Catch-up effect** (Aufholeffekt): poor countries grow faster because small investments raise productivity a lot.\n- **Natural resources:** technology often avoids the limits; resource prices are stable or falling in the long run.\n- **Property rights and political stability:** without them contracts, saving and investment suffer. Peru: no land title, so no collateral and no loans for palm oil.\n- **Incentives in development:** in India parents got dal per vaccine shot and pans for the full sequence; immunisation rose.\n\n**Business cycle** (Konjunkturzyklus)\n\n- **Recession:** two consecutive quarters of falling real GDP. **Peak** = start of the recession, **trough** = output stops falling, **expansion** = recovery, **depression** = severe recession.\n- Three features: co-movement (consumption, investment and employment move with GDP, unemployment against it), limited predictability, persistence.\n- Causes: technology shocks, changing sentiments, monetary or financial factors. Labor demand shifts left. With downward rigid wages employment and output fall more than with flexible wages.\n\n**Measuring unemployment**\n\n- Employed: anyone working, incl. part-time and temporarily absent.\n- Unemployed: no job, available and actively looking.\n- Not in the labor force: students, homemakers, retirees.\n- Labor force (Erwerbspersonen) = employed + unemployed.\n- Unemployment rate = unemployed / labor force x 100.\n- Participation rate = labor force / adult population x 100 *(textbook)*.\n\n**Types of unemployment**\n\n| Type | Cause | Healthy? | Policy |\n| --- | --- | --- | --- |\n| Frictional | search and matching | healthy | none |\n| Structural | skill mismatch, wages above equilibrium | healthy | retraining |\n| Seasonal | weather, seasons | neutral | none |\n| Cyclical | business cycle | unhealthy | fiscal or monetary policy |\n\n**Natural rate of unemployment** = frictional + structural + seasonal (no cyclical). Full employment means unemployment at the natural rate, not 0%.\n\n**Why wages can stay above equilibrium**\n\n- **Minimum wage:** at a wage above WE, labor supplied rises to LS and demanded falls to LD; LS - LD = unemployment.\n- **Unions** (Gewerkschaften): US members earn 10 to 20% more. Pro: counterweight to firms. Contra: a cartel, inefficient, unfair to outsiders.\n- **Insider-outsider theory:** protected insiders gain, outsiders stay unemployed.\n- **Efficiency wages:** better health, lower turnover, better workers, more effort. Ford 1914: $5 a day, twice the going wage, and still profitable.\n\n**Other findings on the slides:** growth above the US average of 3.11% lowered unemployment. Lower unemployment benefits after 2013 led to faster job growth. Unemployment hurts less when peers are unemployed too.", "ch": ["s3"]}, {"id": "sec05", "title": "5. Money and exchange rates (Lecture 04, Project P and 04)", "md": "Banks create money through lending; exchange rates move with supply and demand on the FX market and, in the long run, with price levels (PPP).\n\n**Money**\n\n- Three functions: medium of exchange (Tauschmittel, solves the double coincidence of wants in barter), unit of account (Recheneinheit), store of value (Wertaufbewahrung).\n- **M1** = currency + overnight deposits. **M2** = M1 + deposits up to 2 years maturity + deposits redeemable at notice up to 3 months.\n- **Fractional reserve banking:** banks keep a share R as reserves and lend the rest; each loan becomes a new deposit. **Money multiplier = 1 / R** (R = 10% gives 10). Smaller in reality: people hold cash, banks hold excess reserves (strongly after 2008, when the Fed paid interest on reserves).\n- **Central bank:** monitors banks, controls key interest rates, indirectly controls the money supply. Fed: Board of Governors + 12 regional banks, decisions by the FOMC. ECB: since January 1999, Frankfurt.\n\n**Nominal exchange rate** (Lecture definition): e = units of foreign currency per 1 unit of domestic currency. e rises = domestic currency **appreciates** (Aufwertung); e falls = it **depreciates** (Abwertung). Example from the US view: e = 0.88 euro per dollar, 1/e = 1.13 dollars per euro.\n\n**Regimes:** flexible / floating (market), fixed / pegged (central bank intervenes, needs reserves), managed (in between).\n\n**What moves a currency** (supply and demand on the FX market)\n\n| Change | Effect on the currency |\n| --- | --- |\n| Higher domestic interest rates | demand up, appreciates (peso example: 8 to 9 pesos per dollar) |\n| Higher domestic inflation | demand down, supply up, depreciates (Argentina: 2.50 to 0.50 euro per peso) |\n| Expected appreciation, speculation | demand up, appreciates (10 to 12 cents per peso) |\n| More imports from abroad | supply of own currency up, depreciates (EU imports more from Peru: sol appreciates) |\n| Current account deficit, high debt, instability, recession | depreciates |\n\n**Real exchange rate:** E = (domestic price x e) / foreign price. E rises = domestic goods relatively dearer: exports fall, imports rise. China's undervalued yuan raises the yuan-dollar E: US trade deficit and lower US employment. The Fed could cut rates, so E falls and US net exports rise.\n\n**Troubled euro:** capital flowed into Spain and Ireland (housing boom) and to Greece, Italy, Portugal. After 2007 debts could not be paid, and no country could depreciate. A monetary union without a fiscal union is hard to sustain.\n\n**Purchasing power parity (PPP)** (Kaufkraftparität, Project)\n\n- In the long run arbitrage makes prices converge, so exchange rates follow price levels.\n- Market exchange rates ignore living costs; PPP compares a basket (China leads with 25.3 trn USD vs. US 20.5 trn by PPP).\n- Example: GBP 1 = USD 1.40; if the US basket rises from 1400 to 1500, the real rate becomes 1.50.\n- **Balassa-Samuelson effect:** prices are higher in rich countries because only tradables are arbitraged, not non-tradables like services.\n- **Big Mac Index:** Germany $7.08 vs. Japan $3.08. $35 buys 4.9 Big Macs in Germany, 11.4 in Japan (worth about $80 at German prices). Yen undervalued, euro overvalued.\n- Drawbacks: non-traded inputs like labor, McDonald's not everywhere, only one item.", "ch": ["s4", "r1", "r5"]}, {"id": "sec06", "title": "6. Aggregate demand and supply (Project 01)", "md": "Demand shocks move output only in the short run; in the long run output sits at its natural level and only prices change.\n\n**Aggregate demand (AD)** = demand of households, firms, government and foreigners together. It slopes down because of three effects:\n\n1. **Wealth effect:** higher prices lower the real value of assets, so people buy less.\n2. **Interest rate effect:** higher prices raise money demand and interest rates, so consumption and investment fall.\n3. **Net exports effect:** higher domestic prices make foreign goods cheaper, so imports rise and exports fall.\n\n| AD scenario | Effect |\n| --- | --- |\n| Stock market boom | AD up |\n| Lower government spending | AD down |\n| Lower taxes | AD up |\n| More money printed | AD up |\n| Fear of recession | AD down |\n| Higher incomes of a trading partner | AD up |\n\nAn AD increase raises prices (inflation) in the short run.\n\n**Short-run aggregate supply (SRAS)** slopes up: higher output prices with unchanged input costs give suppliers an incentive to produce more.\n\n| SRAS scenario | Effect |\n| --- | --- |\n| Higher nominal wages | SRAS down |\n| More liquid capital | SRAS up |\n| New robotic technology | SRAS up |\n| Lower taxes on producers | SRAS up |\n| Higher expected inflation | SRAS down |\n| More immigration | SRAS up |\n\n**Long-run aggregate supply (LRAS)** is vertical at natural output. It shifts only with resources (labor, capital, raw materials) and technology.\n\n**Fiscal policy** (Fiskalpolitik) = changing government spending or taxes. **Multiplier:** 1 euro of spending raises GDP by more than 1 euro because spending becomes someone's income (ALDI cashier, hairdresser, plane ticket). Saving weakens it; the government must borrow to spend.\n\n**Costs of inflation:** financial wealth is eroded, saving is discouraged, resources are misallocated, wealth moves from lenders to borrowers.", "ch": ["r3"]}, {"id": "sec07", "title": "7. Balance of payments (Project 02 to 03)", "md": "The balance of payments records all transactions with the rest of the world; a current account deficit must be financed by a financial account surplus.\n\n**Parts of the BOP** (Zahlungsbilanz): current account + capital account + financial account.\n\n**Current account** (Leistungsbilanz) = exports + income receipts - imports - income payments - net transfers.\n\n- **Income receipts:** residents earn on investments abroad (German firm brings profits home from Turkey).\n- **Income payments:** foreigners earn on investments here (UK firm takes profits from a Frankfurt office building).\n- **Unilateral transfers:** money without anything in return: remittances, foreign aid (Germany 2019: 23.8 bn USD, 0.60% of GNI).\n- CA > 0: net lender to the world. CA < 0: net borrower. A deficit is not automatically bad, but it is risky if capital inflows stop.\n\n**Financial account** (Kapitalbilanz): KA = exports of assets - imports of assets. It covers bonds, T-bills, stocks, deposits, real estate, currency, FDI and SDRs.\n\n- **Capital inflow** (+): foreigners buy domestic assets (a Turk buys your Frankfurt flat, China's central bank buys a Bund).\n- **Capital outflow** (-): residents buy foreign assets (a flat in Mallorca, the Bundesbank buys US bonds).\n- Two asset types: IOUs (bonds, deposits: repayment plus interest) and ownership shares (stocks, real estate: no guaranteed return).\n\n**Classifying transactions** (slide examples)\n\n| Transaction | Account |\n| --- | --- |\n| Money sent to family abroad | current account, unilateral transfer |\n| Dividends from a Japanese stock | current account, income receipt |\n| Chinese government buys a German bond | financial account, inflow |\n| Bundesbank buys US dollars | financial account, official reserves |\n\n**Net capital outflow** = residents' purchases of foreign assets - foreigners' purchases of domestic assets. A UK resident buying BMW shares raises UK NCO. Drivers: real interest rates at home and abroad, risk, government policy.\n\n**BOP balances:** US 2011: CA -710 bn, financial account +710 bn. Without capital inflows a CA deficit means more currency is supplied than demanded, so the currency depreciates (UK pound). Exports get cheaper and the deficit shrinks over time.\n\n**Official reserves:** foreign currency held by the central bank to back liabilities, steer monetary policy and intervene on the FX market.", "ch": ["r4"]}, {"id": "sec08", "title": "8. Trade blocs, ECB and currency areas (Project 09 to 10)", "md": "A shared currency removes exchange rate risk but takes away the exchange rate and the own interest rate as shock absorbers.\n\n**WTO** (Welthandelsorganisation): sets the ground rules for smooth, free, predictable trade and settles disputes. Criticism: little transparency, less national sovereignty, patent rules block cheap generic drugs (HIV).\n\n**Most-favoured-nation clause** (Meistbegünstigung): a tariff cut for one member applies to all members.\n\n**Stages of integration** (definitions *textbook*, names on the slides)\n\n1. Preferential trade area: lower, not zero tariffs on some goods.\n2. Free trade area: no tariffs inside, own external tariffs (NAFTA).\n3. Customs union: plus a common external tariff.\n4. Common market: plus free movement of labor and capital (EU).\n\n**Trade diversion** (Handelsumlenkung): a bloc shifts imports from an efficient outsider to a less efficient member. This distorts comparative advantage and is seen as undesirable.\n\n**ECB monetary policy**\n\n- Goal: price stability, inflation below but close to 2% over the medium term (since 2021 a symmetric 2% target *(textbook)*). The Governing Council meets every six weeks.\n- Instruments: open market operations (MRO rate), standing facilities (deposit facility rate, marginal lending facility rate), minimum reserves.\n- Recession: more money, lower rates, more investment and AD. Inflation: the opposite. Higher rates attract capital and appreciate the euro.\n\n**Optimum currency area (OCA)** (optimaler Währungsraum): regions sharing certain traits should share a currency. Four criteria:\n\n1. Mobile, integrated labor market.\n2. Flexible prices and wages, mobile capital.\n3. Central budget to send transfers to regions in trouble.\n4. Similar business cycles.\n\n**Ecuador (dollarisation 2000):** low, stable inflation since then, but no own monetary policy and no devaluation.\n\n**Greece and olive oil:** with the drachma, falling German demand depreciates the drachma (1 drachma = 0.80 euro), olive oil gets cheaper abroad and jobs stay (external devaluation). With the euro, only wage cuts, layoffs or higher VAT remain (internal devaluation) plus austerity: slow, with unemployment and social unrest.\n\n**Asymmetric shocks:** Ireland AD up (inflation gap, needs higher rates), France AD down (unemployment gap, needs lower rates). One ECB rate cannot fit both. With own currencies, Ireland would appreciate and France depreciate. In the euro area adjustment runs through wages (AS shifts) or fiscal policy: contractionary in Ireland, expansionary in France.\n\n**Austerity:** cutting government spending and borrowing to reduce debt; deflationary (e.g. public wages -7%, bonuses -30%, hiring freeze).", "ch": ["r9", "r10"]}, {"id": "sec09", "title": "9. Events and ideas (Lecture 05)", "md": "Each school of thought grew out of a crisis the previous one could not explain.\n\n| Period | School / event | Key idea |\n| --- | --- | --- |\n| Before 1930 | Classical | short run unimportant, flexible prices, vertical AS, money only causes inflation |\n| 1929 to 1933 | Great Depression | the short run matters; no business cycle theory, conflicting advice |\n| 1936 | Keynes, General Theory | AD drives output in the short run; \"animal spirits\" (business confidence) cause cycles; policy activism |\n| 1963 onward | Monetarism (Friedman, Schwartz) | money supply drives cycles; activism makes things worse (time lags); steady money growth, policy rule |\n| 1970s | Natural rate hypothesis (Friedman, Phelps) | pushing unemployment below the natural rate brings ever-rising inflation; confirmed by the 1970s |\n| 1970s to 1980s | New classical | rational expectations (Lucas: only surprise policy works); real business cycles from productivity shocks |\n| 1990s | New Keynesian | sticky prices, so policy can affect output |\n| 1985 to 2007 | Great Moderation | small fluctuations, low inflation, faith in central banks |\n| 2008 onward | Financial crisis | rates at zero were not enough; revival of fiscal policy |\n| 2020 | Covid recession | very severe, very short, followed by a surge in inflation |\n\n**Classical vs. Keynesian AS:** classical SRAS is vertical, so an AD shift changes only prices. Keynesian SRAS slopes up, so an AD shift changes prices and output.\n\n**Liquidity trap** (Liquiditätsfalle): rates cannot fall further, so monetary policy does not work (Keynes's doubt about monetary policy).\n\n**Roosevelt:** modest deficit spending helped; balancing the budget and raising rates in 1937 caused a new slump.\n\n**Friedman agrees with Keynes:** the short run matters and the Depression needed more expansion. **He disagrees:** any activist policy makes things worse; better an autopilot rule.\n\n**Political business cycle:** pump up the economy before an election, pay later (Nixon 1972; Rogoff: \"the all-time hero of political business cycles\").\n\n**After 2008**\n\n- Austerity 2010 to 2013: each dollar of budget cuts reduced GDP by about $1.50.\n- Secular stagnation: low population growth and slow technical progress keep the interest rate needed for full employment near zero.\n- New view on debt: the debt-to-GDP ratio matters; it shrinks if interest rates are below growth.\n- Little room for rate cuts, so strengthen automatic stabilizers (taxes and benefits that react without new laws).\n\n**Covid lesson:** the economy is less flexible in the short run than hoped, but the AD-AS framework still holds.", "ch": ["s5"]}, {"id": "sec10", "title": "10. Formula sheet", "md": "Every formula you may need to calculate, with a mini example.\n\n| Topic | Formula | Mini example |\n| --- | --- | --- |\n| GDP | Y = C + I + G + NX | 500 + 150 + 200 + 50 = 900 |\n| GDP deflator | nominal GDP / real GDP x 100 | 600 / 350 x 100 = 171.4 |\n| Inflation | (P2 - P1) / P1 x 100 | CPI 175 to 250: 42.9% |\n| CPI | cost of basket now / cost in base year x 100 | $14 / $8 x 100 = 175 |\n| Real interest rate | nominal - inflation | 5% - 2% = 3% |\n| Today's dollars | amount T x (price level today / price level T) | $100 x 250 / 50 = $500 |\n| Growth rate | (X2 - X1) / X1 x 100 | 40,000 to 41,200: 3% |\n| Rule of 70 | doubling time = 70 / growth rate | 2% gives 35 years |\n| Labor force | employed + unemployed | 44 + 2 = 46 m |\n| Unemployment rate | unemployed / labor force x 100 | 2 / 46 x 100 = 4.35% |\n| Participation rate *(textbook)* | labor force / adult population x 100 | 46 / 65 x 100 = 70.8% |\n| Money multiplier | 1 / R | R = 10%: 10; $1,000 deposit can become $10,000 |\n| Nominal exchange rate | e = foreign currency per 1 domestic | e = 0.88 EUR per USD, 1/e = 1.14 USD per EUR |\n| Real exchange rate | E = (domestic price x e) / foreign price | (100 x 7) / 600 = 1.17 |\n| PPP rate | basket price B / basket price A | $1,400 / GBP 1,000 = 1.40 |\n| Big Mac valuation | (PPP rate - market rate) / market rate x 100 | (87 - 150) / 150 = -42%, undervalued |\n| Opportunity cost | given up / gained | 200 ships / 2000 planes = 0.1 ship per plane |\n| Elasticity, midpoint | (dQ / avg Q) / (dP / avg P) | A to B: (2/3) / (-1/8.5) = -5.67 |\n| Consumer surplus | willingness to pay - price | |\n| Tariff revenue | tariff x imports after tariff | 2 x 6 = 12 m EUR (sugar) |\n| Deadweight loss | 0.5 x tax x change in quantity (each triangle) | ice cream: 0.5 x 0.50 x 10 = 2.50 |\n| GNP | GDP + income receipts - income payments | 3,430 + 97 - 64 = 3,463 |\n| Current account | X + income receipts - M - income payments - net transfers | |\n| Financial account | exports of assets - imports of assets | |\n| Isocost | C = wL + rK, slope -(w/r) | |\n\n**Sugar market Montenegro** (Qd = 14 - P, Qs = P, read from the graph): world price 2 EUR gives imports 10. Tariff to 4 EUR: production 4, imports 6, revenue 12, consumer surplus -22, producer surplus +6, deadweight loss 4.", "ch": []}, {"id": "sec11", "title": "11. Typical exam pitfalls", "md": "These mistakes cost points most often.\n\n- Unemployment rate: divide by the **labor force**, not the population. Students and retirees are not unemployed.\n- GDP: new houses are **investment**, transfer payments are **not** in G, used goods do **not** count, unsold inventory **counts** as I.\n- Real vs. nominal: growth always with **real** GDP; real interest = nominal - inflation.\n- Comparative advantage is about **opportunity cost**, not about who is faster. Nobody has the comparative advantage in both goods.\n- Tariff deadweight loss = **B + D**, not C (C is government revenue).\n- Exchange rate direction: on the Lecture slides e = foreign per domestic, so e rises = domestic currency **appreciates**. Always say which currency you mean.\n- Higher interest rates = **appreciation**; higher inflation = **depreciation**.\n- Elasticity is a **pure number**; the % sign on the Project slides is misleading.\n- Real exchange rate up = domestic goods dearer = **fewer exports**.\n- Saving raises the **level** of income, not the long-run **growth rate** (diminishing returns).\n- Natural rate of unemployment is **not zero**: frictional + structural + seasonal.\n- Classical vs. Keynesian: vertical vs. upward-sloping **SRAS**.\n- BOP: a current account deficit is financed by a **financial account surplus**.\n- In open questions: define the term, explain the mechanism, give the slide example. That is usually what the marks are for.", "ch": []}];

// Parametric calculation generators. Each returns {q, ans, unit, dp, steps[]} or {q, choices[], ans(index), steps[]}
const R = {
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),

  const curves=()=>L(60,30,330,210,"dem")+L(60,210,330,30,"sup")+Tx(334,214,"Demand","lbs")+Tx(334,34,"Supply","lbs");
  const D={
    tariff:{t:"Effect of a tariff (Schubert 1.3)",e:"The tariff raises the price from Pw to Pw + t. Consumer surplus falls by A+B+C+D, producer surplus rises by A, government revenue is C. Deadweight loss is B + D.",svg(){
      const pw=192, pt=160; const a=sX(pw), b=sX(pt), c=dX(pt), d=dX(pw);

    ppf:{t:"Production possibilities frontier (Schubert 0.3, Rumiche 05)",e:"Points on the frontier (A, B) are efficient, Z inside is inefficient, W outside is not feasible. Bowed outward: rising opportunity cost.",svg(){

      const d1=[70,60,300,200], d2=[120,60,340,190], sp=[70,210,330,40]; const [ax,ay]=X(d1,sp), [bx,by]=X(d2,sp);
      return wrap(axes("Quantity of dollars","e (price of $)")+Lr(d1,"dem")+Lr(d2,"dem2")+Lr(sp,"sup")+Tx(300,214,"D1","lbs")+Tx(336,196,"D2","lbs")+Tx(332,46,"S","lbs")

      let d=`M ${O.x} ${O.y}`; for(let i=1;i<=40;i++){const x=O.x+i*7.2; const y=O.y-185*Math.sqrt(i/40); d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;}
      return wrap(axes("Capital per worker","Output per worker")+`<path class="crv" d="${d}"/>`+Tx(120,190,"1. low capital: an extra unit","lbs")+Tx(120,203,"adds a lot of output","lbs")+Tx(200,110,"2. high capital: an extra unit","lbs")+Tx(200,123,"adds little output","lbs"),"Production function");}},

      let d=""; for(let i=0;i<=60;i++){const x=O.x+i*5.2; const y=190-i*2.0-22*Math.sin(i/6.2); d+=(i?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1);}
      const f=i=>190-i*2.0-22*Math.sin(i/6.2); const ip=13.45, it=25.5; const px=O.x+ip*5.2, py=f(ip); const tx=O.x+it*5.2, ty=f(it);
      return wrap(axes("Time","Real GDP")+`<rect class="fB" x="${px}" y="${T}" width="${tx-px}" height="${O.y-T}"/>`+L(O.x,190,O.x+312,66,"dsh")+`<path class="crv" d="${d}"/>`+dot(px,py)+Tx(px,py-10,"Peak","lb","middle")+dot(tx,ty)+Tx(tx,ty+18,"Trough","lb","middle")+Tx((px+tx)/2,40,"Recession","lbs","middle")+Tx(tx+60,60,"Expansion","lbs","middle")+Tx(O.x+300,80,"Trend","lbs","end"),"Business cycle");}},
    adas:{t:"AD shift with upward-sloping SRAS (Keynesian view, Schubert 05)",e:"Keynesian view: SRAS slopes upward, so an increase in AD (AD1 to AD2) raises output (Y1 to Y2) and the price level (P1 to P2). In the classical view SRAS is vertical and only prices rise.",svg(){
      const a1=[70,60,280,210], a2=[130,50,340,200], sr=[70,200,330,50]; const [x1,y1]=X(a1,sr), [x2,y2]=X(a2,sr);
      return wrap(axes("Real GDP","Price level")+Lr(a1,"dem")+Lr(a2,"dem2")+Lr(sr,"sup")+Tx(270,214,"AD1","lbs")+Tx(334,196,"AD2","lbs")+Tx(326,46,"SRAS","lbs","end")
        +dot(x1,y1)+dot(x2,y2)+dash(O.x,y1,x1,y1)+dash(x1,y1,x1,O.y)+dash(O.x,y2,x2,y2)+dash(x2,y2,x2,O.y)+Tx(O.x-4,y1+4,"P1","lb","end")+Tx(O.x-4,y2+4,"P2","lb","end")+Tx(x1,O.y+14,"Y1","lbs","middle")+Tx(x2,O.y+14,"Y2","lbs","middle"),"AD AS");}},
    lras:{t:"Long-run aggregate supply (Rumiche 01)",e:"LRAS is vertical at the natural level of output. An increase in AD only raises the price level in the long run (A to B). LRAS shifts with resources and technology.",svg(){
      const a1=[80,70,300,210], a2=[110,30,330,170], lr=[200,20,200,O.y]; const [,y1]=X(a1,lr), [,y2]=X(a2,lr);
      return wrap(axes("Real GDP","Price level")+Lr(lr,"sup")+Tx(206,36,"LRAS","lbs")+Lr(a1,"dem")+Lr(a2,"dem2")+Tx(292,214,"AD1","lbs")+Tx(324,160,"AD2","lbs")
        +dot(200,y1)+dot(200,y2)+Tx(208,y1+6,"A","lb")+Tx(208,y2-2,"B","lb")+dash(O.x,y1,200,y1)+dash(O.x,y2,200,y2)+Tx(O.x-4,y1+4,"P1","lb","end")+Tx(O.x-4,y2+4,"P2","lb","end")+Tx(200,O.y+14,"Natural output","lbs","middle"),"LRAS");}},
    taxwedge:{t:"Tax on sellers: ice cream (Rumiche 00)",e:"A tax of 0.50 shifts supply up from S1 to S2. Buyers pay 3.30, sellers keep 2.80, quantity falls from 100 to 90. Revenue = 0.50 x 90 = 45; deadweight loss = triangle 0.5 x 0.50 x 10 = 2.50.",svg(){
      const dm=[80,30,330,190], s1=[60,216,330,40], s2=[60,180,300,24]; const [x0,y0]=X(dm,s1), [x1,yb]=X(dm,s2); const ys=s1[1]+(x1-s1[0])*(s1[3]-s1[1])/(s1[2]-s1[0]);
      return wrap(axes("Ice-cream cones","Price")+P([[O.x,yb],[x1,yb],[x1,ys],[O.x,ys]],"fC")+P([[x1,yb],[x0,y0],[x1,ys]],"fD")+Lr(dm,"dem")+Lr(s1,"sup")+Lr(s2,"dem2")
        +Tx(324,202,"Demand","lbs","end")+Tx(334,52,"S1","lbs","end")+Tx(300,40,"S2","lbs","end")+Tx(O.x-4,yb+4,"3.30","lb","end")+Tx(O.x-4,y0+4,"3.00","lb","end")+Tx(O.x-4,ys+8,"2.80","lb","end")
        +dash(x1,yb,x1,O.y)+dash(x0,y0,x0,O.y)+dash(O.x,y0,x0,y0)+Tx(x1-4,O.y+14,"90","lbs","end")+Tx(x0+4,O.y+14,"100","lbs")+Tx(50,ys+16,"Revenue = shaded box","lbs")+Tx(x0+8,y0+4,"DWL","lbs"),"Tax wedge");}},
    circular:{t:"Circular flow diagram (Schubert 0.3 and 2.1)",e:"Households buy goods and services from firms and sell factors of production (labor, land, capital) to firms. Outer arrows: money (spending, revenue, wages, rent, profit). Inner arrows: goods, services and inputs.",svg(){
      const box=(x,y,w,h,s)=>`<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`+Tx(x+w/2,y+h/2+4,s,"lb","middle");
      return wrap(box(10,105,90,46,"Households")+box(280,105,90,46,"Firms")+box(130,12,120,40,"Goods & services")+box(130,204,120,40,"Factor markets")
        +`<path class="mflow" d="M 40 105 L 40 28 L 130 28"/><path class="mflow" d="M 250 28 L 340 28 L 340 105"/><path class="mflow" d="M 340 151 L 340 230 L 250 230"/><path class="mflow" d="M 130 230 L 40 230 L 40 151"/>`
        +`<path class="rflow" d="M 130 44 L 70 44 L 70 105"/><path class="rflow" d="M 310 105 L 310 44 L 250 44"/><path class="rflow" d="M 70 151 L 70 214 L 130 214"/><path class="rflow" d="M 250 214 L 310 214 L 310 151"/>`
        +Tx(190,72,"outer: money flows","lbs","middle")+Tx(190,88,"inner: goods and inputs","lbs","middle")+Tx(85,22,"spending","lbs","middle")+Tx(296,22,"revenue","lbs","middle")+Tx(296,252,"wages, rent, profit","lbs","middle")+Tx(85,252,"income","lbs","middle"),"Circular flow");}},
    asym:{t:"Asymmetric shocks in a currency union (Rumiche 10)",e:"Ireland (left): AD rises, output and prices rise (inflation gap), it needs higher rates. France (right): AD falls (unemployment gap), it needs lower rates. One ECB rate cannot serve both; adjustment via wages (AS) or fiscal policy.",svg(){
      const pan=(ox,lab,dir)=>{const ax=`<line class="ax" x1="${ox}" y1="224" x2="${ox+160}" y2="224"/><line class="ax" x1="${ox}" y1="224" x2="${ox}" y2="30"/>`;
        const ad1=L(ox+20,70,ox+150,200,"dem"), ad2=dir>0?L(ox+50,50,ox+160,160,"dem2"):L(ox+5,100,ox+110,210,"dem2");
        return ax+ad1+ad2+L(ox+15,205,ox+155,60,"sup")+Tx(ox+80,22,lab,"lb","middle")+Tx(ox+158,58,"AS","lbs","end")+Tx(ox+146,214,"AD1","lbs","end")+Tx(dir>0?ox+158:ox+70,dir>0?172:218,"AD2","lbs",dir>0?"end":"start")+Tx(ox+80,244,dir>0?"Inflation gap":"Unemployment gap","lbs","middle");};
      return wrap(pan(20,"Ireland",1)+pan(205,"France",-1),"Asymmetric shocks");}}
  };
  return D;
})();

</script>
<script>
// ================= Macro Trainer app =================
const EXAM_DATE = new Date(2026, 10, 13); // Fri 13 Nov 2026
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const CH = Object.fromEntries(CHAPTERS.map(c=>[c.id,c]));
const chLabel = id => { const c=CH[id]; return (c.deck==="S"?"Lecture ":"Project ")+c.no; };

// ---- give every item a stable id
GLOSSARY.forEach(g=>{ g.id="t-"+slug(g.t); });
QUESTIONS.forEach((q,i)=>{ q.id="q-"+q.ch+"-"+slug(q.q.slice(0,40)); });
MCQ.forEach((m,i)=>{ m.id="m-"+m.ch+"-"+i; });
GRAPHQ.forEach((g,i)=>{ g.id="g-"+g.g+"-"+i; g.ch = ({tariff:"s1",imports:"s1",exports:"s1",ppf:"s0",ppfshift:"s0",fx:"s4",minwage:"s3",prodfn:"s3",cycle:"s3",adas:"s5",lras:"r3",taxwedge:"r2",circular:"s0",asym:"r10"})[g.g]; });

// ================= state & persistence =================
const BLANK = () => ({v:1, updated:0, cards:{}, q:{}, calc:{}, g:{}, m:{}, days:{}, exams:[], star:{}, read:{}, prefs:{de:false, dir:"t2d"}});
let S = BLANK();
let sync = {mode:"local", db:null, ref:null, writing:false, pending:false, timer:null, msg:"Saved in this browser"};
const LSK = "macro-trainer-v1";

function loadLocal(){ try{ const raw=localStorage.getItem(LSK); if(raw){ const o=JSON.parse(raw); if(o&&o.v===1) return Object.assign(BLANK(),o);} }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){} }
function touch(){
  S.updated = Date.now(); saveLocal();
  if(sync.ref){ clearTimeout(sync.timer); sync.timer=setTimeout(flush, 1500); }
  renderSync();
}
async function flush(){
  if(!sync.ref) return;
  if(sync.writing){ sync.pending=true; return; }
  sync.writing=true;
  try{ await sync.ref.set(JSON.parse(JSON.stringify(S))); sync.msg="Saved to your account"; }
  catch(e){ if(e&&e.code==="invalid_argument"){ sync.ref=null; sync.mode="local"; sync.msg="Saved in this browser only"; } else sync.msg="Sync paused, saved in this browser"; }
  sync.writing=false; renderSync();
  if(sync.pending){ sync.pending=false; flush(); }
}
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/"+uid+"/progress");
    const timer = new Promise(r=>setTimeout(()=>r("timeout"),10000));
    const snap = await Promise.race([ref.get(), timer]);
    if(snap==="timeout"){ sync.msg="Account storage not reachable, saved in this browser"; renderSync(); return; }
    sync.ref=ref; sync.mode="cloud";
    if(snap.exists){
      const remote = Object.assign(BLANK(), snap.data());
      if((remote.updated||0) >= (S.updated||0)){ S = remote; saveLocal(); render(); }
      else flush();
    } else if(S.updated) flush();
    sync.msg="Saved to your account"; renderSync();
  }catch(e){ /* stay local */ }
}
function renderSync(){ const el=$("#sync"); if(el){ el.textContent=sync.msg; el.dataset.mode=sync.mode; } }

function logActivity(){ const k=dayKey(); S.days[k]=(S.days[k]||0)+1; }

// ================= scoring =================
const BOX_MAX = 5;
const INTERVAL_H = [0, 0.15, 20, 44, 72, 120]; // hours per Leitner box (exam is close: short intervals)
function cardScore(id){ const c=S.cards[id]; return c? c.b/BOX_MAX : 0; }
function qScore(id){ const c=S.q[id]; return c? c.s : 0; }
function mcqScore(id){ const c=S.m&&S.m[id]; return c? Math.min(1,c.b/2) : 0; }
function graphScore(id){ const c=S.g[id]; return c? Math.min(1,c.b/2) : 0; }
function calcScore(id){ const c=S.calc[id]; return c? Math.min(1,c.b/3) : 0; }
function isDue(id){ const c=S.cards[id]; if(!c) return true; return (Date.now()-c.t)/36e5 >= INTERVAL_H[c.b]; }
function chapterItems(ch){
  return { cards:GLOSSARY.filter(g=>g.ch===ch), qs:QUESTIONS.filter(q=>q.ch===ch), gs:GRAPHQ.filter(g=>g.ch===ch), ms:MCQ.filter(x=>x.ch===ch), cs:CALC.filter(c=>c.ch===ch) };
}
function chapterMastery(ch){
  const it=chapterItems(ch); let sum=0, w=0;
  it.cards.forEach(g=>{sum+=cardScore(g.id); w+=1;});
  it.qs.forEach(q=>{sum+=qScore(q.id)*2; w+=2;});
  it.gs.forEach(g=>{sum+=graphScore(g.id); w+=1;});
  it.ms.forEach(x=>{sum+=mcqScore(x.id); w+=1;});
  it.cs.forEach(c=>{sum+=calcScore(c.id)*2; w+=2;});
  return w? sum/w : 0;
}
function overallMastery(){ let s=0; CHAPTERS.forEach(c=>s+=chapterMastery(c.id)); return s/CHAPTERS.length; }
function streak(){ let n=0; const d=new Date(); if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1); while(S.days[dayKey(d)]){ n++; d.setDate(d.getDate()-1);} return n; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((EXAM_DATE-t)/864e5); }

// record results
function rateCard(id, r){ // r: 0 again,1 hard,2 good,3 easy
  const c=S.cards[id]||{b:0,n:0,ok:0,t:0}; c.n++; if(r>=2) c.ok++;
  c.b = r===0?0 : r===1? Math.max(1,c.b) : Math.min(BOX_MAX, c.b+(r===3?2:1));
  c.t=Date.now(); S.cards[id]=c; logActivity(); touch();
}
function rateQ(id, s){ const c=S.q[id]||{s:0,n:0,best:0,t:0}; c.n++; c.s = c.n===1? s : Math.round((c.s*0.4+s*0.6)*100)/100; c.best=Math.max(c.best||0,s); c.t=Date.now(); S.q[id]=c; logActivity(); touch(); }
function rateBox(store, id, ok){ const c=store[id]||{b:0,n:0,ok:0,t:0}; c.n++; if(ok){c.ok++; c.b=Math.min(4,c.b+1);} else c.b=Math.max(0,c.b-1); c.t=Date.now(); store[id]=c; logActivity(); touch(); }

// ================= Claude helpers =================
let sampleFn = null;
async function initSample(){ try{ if(window.claude&&window.claude.use){ sampleFn = await window.claude.use("sample"); if(sampleFn) document.body.classList.add("has-claude"); } }catch(e){} }

// ================= routing & shell =================
const VIEWS = [
  {id:"home", label:"Overview"},
  {id:"sheet", label:"Reading sheet"},
  {id:"lexicon", label:"Lexicon"},
  {id:"learn", label:"Topics"},
  {id:"cards", label:"Flashcards"},
  {id:"quiz", label:"Quick quiz"},
  {id:"open", label:"Open questions"},
  {id:"calc", label:"Calculations"},
  {id:"graphs", label:"Graphs"},
  {id:"exam", label:"Mock exam"}

// ---------- Reading sheet
function mdInline(t){
  let h=esc(t);
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>");
  h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function mdRender(md){
  const lines=md.split("\n"); let out="", i=0;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){ i++; continue; }
    if(l.startsWith("|")){
      const rows=[]; while(i<lines.length&&lines[i].startsWith("|")){ rows.push(lines[i]); i++; }
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(rows[0]), body=rows.slice(2).map(cells);
      out+=`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(/^- /.test(l)){ let it=""; while(i<lines.length&&/^- /.test(lines[i])){ it+=`<li>${mdInline(lines[i].slice(2))}</li>`; i++; } out+=`<ul>${it}</ul>`; continue; }
    if(/^\d+\. /.test(l)){ let it=""; while(i<lines.length&&/^\d+\. /.test(lines[i])){ it+=`<li>${mdInline(lines[i].replace(/^\d+\. /,""))}</li>`; i++; } out+=`<ol>${it}</ol>`; continue; }
    out+=`<p>${mdInline(l)}</p>`; i++;
  }
  return out;
}
function readBanner(){
  const n=SHEET.filter(x=>S.read[x.id]).length;
  return `<section class="panel readban"><div><h2>Reading sheet</h2><p class="muted small">${n} of ${SHEET.length} sections read. Read a section, then practise it right away.</p></div>${bar(n/SHEET.length)}<button class="btn" data-go="sheet">${n?"Continue reading":"Start reading"}</button></section>`;
}

  m.querySelector(".sheet").onchange=e=>{ const c=e.target.closest("[data-read]"); if(!c) return; if(c.checked) S.read[c.dataset.read]=Date.now(); else delete S.read[c.dataset.read]; touch(); const a=m.querySelector(`[data-jump="${c.dataset.read}"]`); if(a) a.classList.toggle("done",c.checked); const k=SHEET.filter(x=>S.read[x.id]).length; m.querySelector(".vh .mrow").innerHTML=`${bar(k/SHEET.length)}<span>${k} / ${SHEET.length} read</span>`; };

  };

  $("#lexStar").onchange=e=>{lexOnlyStar=e.target.checked; draw();};

function termCard(g){

  return `<article class="term" id="${g.id}">

    <p>${esc(g.d)}</p>
    ${g.f?`<div class="formula">${esc(g.f)}</div>`:""}
    ${S.prefs.de&&g.x?`<p class="dex">${esc(g.x)}</p>`:g.x?`<details class="dexd"><summary>Auf Deutsch</summary><p class="dex">${esc(g.x)}</p></details>`:""}
    <div class="term-f"><span class="src">${esc(chLabel(g.ch))}</span>${g.src==="added"?`<span class="chip warn">not on slides</span>`:""}${st}
      <button class="link claude-only" data-explain="${g.id}">Explain with an example</button></div>

async function lexClick(e){
  const s=e.target.closest("[data-star]"); if(s){ const id=s.dataset.star; if(S.star[id]) delete S.star[id]; else S.star[id]=true; touch(); s.classList.toggle("on"); s.textContent=S.star[id]?"Starred":"Star"; s.setAttribute("aria-pressed",!!S.star[id]); return; }
  const x=e.target.closest("[data-explain]"); if(x){ explainTerm(x.dataset.explain, x); }
}
async function explainTerm(id, btn){
  const g=GLOSSARY.find(t=>t.id===id); const box=$("#ai-"+id); if(!sampleFn||!box) return;
  btn.disabled=true; box.textContent="Thinking...";
  const prompt=`You help a university student revise for a written exam in "Principles of Macroeconomics" (SRH Heidelberg). The exam is in English.
Term: ${g.t} (German: ${g.de})
Definition from the lecture: ${g.d}${g.f?"\nFormula: "+g.f:""}
Write a short explanation:
1) Two or three sentences in German that explain the idea simply. Keep the English term.
2) One concrete example with numbers if it fits.
3) One typical mistake students make in exams with this term (in English).
Under 130 words. Plain text, no markdown, no headings. Use only straight quotes (") and normal hyphens (-), no arrows or special dashes.`;
  try{ const r=await sampleFn(prompt,{modelTier:"quick",onText:({text})=>{box.textContent=text;}}); box.textContent=r.text; }
  catch(err){ box.textContent = err&&err.code==="rate_limited" ? "Too many requests right now. Try again in a minute." : "Claude is not available here right now."; }
  btn.disabled=false;
}

const sortWeakQ = qs => [...qs].sort((a,b)=>(qScore(a.id)-qScore(b.id)) || ((S.q[a.id]?.t||0)-(S.q[b.id]?.t||0)));
const calcQueue = (types,n) => { const out=[]; for(let i=0;i<n;i++){ const t=types[i%types.length]; out.push({k:"calc",ref:t}); } return shuffle(out); };

function cardPool(){
  let p=GLOSSARY.filter(g=>cardCh==="all"||g.ch===cardCh);
  if(cardScope==="due") p=p.filter(g=>isDue(g.id));
  if(cardScope==="new") p=p.filter(g=>!S.cards[g.id]);
  if(cardScope==="weak") p=p.filter(g=>S.cards[g.id]&&S.cards[g.id].b<=2);
  if(cardScope==="star") p=p.filter(g=>S.star[g.id]);
  return shuffle(p).sort((a,b)=>(S.cards[a.id]?.b??-1)-(S.cards[b.id]?.b??-1));
}
function boxDist(){
  const n=[0,0,0,0,0,0]; let fresh=0; GLOSSARY.forEach(g=>{const c=S.cards[g.id]; if(!c) fresh++; else n[c.b]++;});
  const mx=Math.max(fresh,...n,1);
  const col=(l,v,cls)=>`<div class="bcol"><div class="bfill ${cls}" style="height:${Math.max(2,v/mx*100)}%"></div><b>${v}</b><span>${l}</span></div>`;
  return `<div class="boxes">${col("New",fresh,"muted")}${n.map((v,i)=>col("Box "+i,v,i>=4?"good":i>=2?"ok":"warn")).join("")}</div>`;
}

// ================= smart session =================
function startSmart(){
  const order=[...CHAPTERS].sort((a,b)=>chapterMastery(a.id)-chapterMastery(b.id)).map(c=>c.id);
  const weakCh=order.slice(0,4);
  const due=GLOSSARY.filter(g=>isDue(g.id)).sort((a,b)=>(weakCh.includes(b.ch)?1:0)-(weakCh.includes(a.ch)?1:0) || (S.cards[a.id]?.b??-1)-(S.cards[b.id]?.b??-1)).slice(0,6);
  const qs=sortWeakQ(QUESTIONS.filter(q=>weakCh.includes(q.ch))).slice(0,2);
  const cs=[...CALC].sort((a,b)=>calcScore(a.id)-calcScore(b.id)).slice(0,2);
  const gs=[...GRAPHQ].sort((a,b)=>graphScore(a.id)-graphScore(b.id)||Math.random()-0.5).slice(0,2);
  const ms=[...MCQ].filter(x=>weakCh.includes(x.ch)).sort((a,b)=>mcqScore(a.id)-mcqScore(b.id)||Math.random()-0.5).slice(0,2);
  const items=[...due.map(g=>({k:"card",ref:g})),...ms.map(x=>({k:"mcq",ref:x})),...qs.map(q=>({k:"open",ref:q})),...cs.map(c=>({k:"calc",ref:c})),...gs.map(g=>({k:"graph",ref:g}))];
  startRunner(items,"Smart session");
}

// ================= runner =================
let runner=null;
function startRunner(items,title,opt={}){
  if(!items.length) return;
  runner={items,title,i:0,res:[],exam:!!opt.exam,timer:opt.timer||0,start:Date.now(),cur:null};
  history.replaceState(null,"","#"+view); render(); window.scrollTo(0,0);
}
let tick=null;
function renderRunner(){
  const m=$("#main"), r=runner;
  clearInterval(tick);
  if(r.i>=r.items.length){ return renderSummary(m); }
  const it=r.items[r.i];
  m.innerHTML=`<div class="run-h"><button class="link" id="rQuit">${r.exam?"Stop exam":"Stop"}</button><b>${esc(r.title)}</b><span class="muted">${r.i+1} / ${r.items.length}</span><span id="rTime" class="time"></span></div>
  <div class="run-bar">${bar(r.i/r.items.length)}</div><div id="item"></div>`;
  $("#rQuit").onclick=()=>{ if(r.res.length) { r.items=r.items.slice(0,r.i); renderRunner(); } else { runner=null; render(); } };
  if(r.timer){ const upd=()=>{ const left=r.timer-Math.floor((Date.now()-r.start)/1000); const el=$("#rTime"); if(!el) return; const a=Math.abs(left); el.textContent=(left<0?"Over by ":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); el.classList.toggle("over",left<0); }; upd(); tick=setInterval(upd,1000); }
  const box=$("#item");
  const done=(score,max=1)=>{ r.res.push({it,score,max}); r.i++; renderRunner(); window.scrollTo(0,0); };
  ({card:runCard,mcq:runMcq,open:runOpen,calc:runCalc,graph:runGraph})[it.k](box,it,done);
}
function renderSummary(m){
  const r=runner; clearInterval(tick);
  const tot=r.res.reduce((a,x)=>a+x.score*(x.it.pts||1),0), max=r.res.reduce((a,x)=>a+(x.it.pts||1),0);
  if(r.exam&&r.res.length) { S.exams.push({t:Date.now(),score:Math.round(tot*10)/10,max}); touch(); }
  const sec=k=>{const xs=r.res.filter(x=>x.it.k===k); if(!xs.length) return ""; const s=xs.reduce((a,x)=>a+x.score*(x.it.pts||1),0), mx=xs.reduce((a,x)=>a+(x.it.pts||1),0); return `<li><span>${({card:"Flashcards",mcq:"Quick quiz",open:"Open questions",calc:"Calculations",graph:"Graphs"})[k]}</span><b>${Math.round(s*10)/10} / ${mx}</b>${bar(s/mx)}</li>`;};
  const weak=r.res.filter(x=>x.score<0.5).map(x=>x.it.ref.ch||"").filter(Boolean); const wc=[...new Set(weak)].slice(0,4);
  const mins=Math.round((Date.now()-r.start)/60000);
  m.innerHTML=`<section class="panel summary"><span class="src">${esc(r.title)}</span><h1>${r.res.length? Math.round(tot/max*100)+"%":"Stopped"}</h1>
    <p class="muted">${r.res.length} task${r.res.length===1?"":"s"} in ${mins} min${r.exam?`, ${Math.round(tot*10)/10} of ${max} points`:""}.</p>
    <ul class="sum">${["card","mcq","open","calc","graph"].map(sec).join("")}</ul>
    ${wc.length?`<p>Review next: ${wc.map(c=>`<button class="link" data-go="learn" data-p="${c}">${esc(chLabel(c))}: ${esc(CH[c].title)}</button>`).join(", ")}</p>`:""}
    <div class="row"><button class="btn primary" id="again">${r.exam?"New mock exam":"Another smart session"}</button><button class="btn" data-go="home">Back to overview</button></div></section>`;
  $("#again").onclick=()=>{ if(r.exam) go("exam"); else startSmart(); };
  runner=null; // summary stays on screen until the next navigation
}
