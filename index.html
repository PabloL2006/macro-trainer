 // s0
 {ch:"s0",q:"Explain the difference between microeconomics and macroeconomics and give one typical question for each.",a:"Microeconomics studies how households and firms make decisions and interact in individual markets (usually one market, other variables taken as given). Example: How does a tax on cigarettes affect the price and quantity of cigarettes? Macroeconomics studies economy-wide phenomena such as inflation, unemployment and growth and the interaction of several markets; it explains variables micro takes as given. Example: Why does unemployment rise in a recession?",k:["households and firms / single markets","economy-wide: inflation, unemployment, growth","one example each"]},
 {ch:"s0",q:"Name the ten principles of economics and group them into the three categories.",a:"How people make decisions: 1 people face trade-offs, 2 the cost of something is what you give up to get it, 3 rational people think at the margin, 4 people respond to incentives. How people interact: 5 trade can make everyone better off, 6 markets are usually a good way to organize economic activity, 7 governments can sometimes improve market outcomes. How the economy as a whole works: 8 standard of living depends on ability to produce goods and services, 9 prices rise when the government prints too much money, 10 society faces a short-run trade-off between inflation and unemployment.",k:["three groups","decisions 1-4","interaction 5-7","economy 8-10"]},
 {ch:"s0",q:"What is opportunity cost? What is your opportunity cost of sitting in this lecture?",a:"Opportunity cost is whatever must be given up to obtain some item, i.e. the benefit of the best foregone alternative. For a lecture it is e.g. the wage I could have earned in a job during that time, leisure, or studying another subject. Tuition already paid is a sunk cost and not part of the decision at the margin.",k:["best alternative given up","example: foregone wage / leisure","sunk costs not included"]},
 {ch:"s0",q:"Explain what 'rational people think at the margin' means and why sunk costs should be ignored.",a:"Rational people systematically do the best they can. They decide by comparing marginal benefits and marginal costs of small incremental adjustments, and take an action only if marginal benefit exceeds marginal cost. Sunk costs are past costs that cannot be recovered whatever one decides, so they do not change marginal costs or benefits and should not influence the decision.",k:["marginal benefit vs marginal cost","act only if MB > MC","sunk costs unrecoverable"]},
 {ch:"s0",q:"Using the example of gasoline prices (2005-2008), explain how people respond to incentives. What could be unintended consequences of incentives that push people from welfare into work?",a:"When oil prices rose and US gasoline went from about 2 to 4 dollars a gallon, people had a higher incentive to save fuel: smaller cars, scooters, bicycles, mass transit, moving near train stations, online courses, more fuel-efficient aircraft. Policy works the same way by changing costs or benefits. Cutting benefits or paying in-work bonuses can push people into work, but unintended consequences are possible, e.g. people taking unsuitable jobs, more poverty for those who cannot work, or firms lowering wages because the state tops them up.",k:["higher price leads to less consumption","examples of adjustment","policy changes costs/benefits","unintended consequence"]},
 {ch:"s0",q:"Describe the circular flow model. What are its assumptions and how would you extend it with a government?",a:"Households and firms are the decision makers. In the market for goods and services households buy and firms sell; in the market for factors of production (labor, land, capital) firms buy and households sell. The outer arrows show money flows (spending, revenue, wages, rent, profit), the inner arrows the flows of goods and inputs. Assumptions: only two actors, no government, no foreign sector, no saving or financial markets. Extension: a government collects taxes from households and firms and spends on goods (G) and transfers; it also buys inputs, so new money flows are added.",k:["households and firms","goods market and factor market","money flows vs real flows","assumptions: no government, no foreign trade, no saving","extension with taxes and G"]},
 {ch:"s0",q:"What does a production possibilities frontier show? Explain efficiency, opportunity cost, the bowed-out shape and economic growth with it.",a:"The PPF shows all combinations of two goods an economy can produce with its resources and technology. Points on the frontier are efficient, points inside inefficient, points outside not feasible. Moving along it shows the trade-off; its slope is the opportunity cost of one good in terms of the other. It is bowed outward because resources are specialised: the more cars are produced, the more computers must be given up for one more car. Technological progress shifts the frontier outward (economic growth), so more of both goods can be produced (A to G).",k:["combinations given resources","on = efficient, inside = inefficient, outside = not feasible","slope = opportunity cost","bowed out: increasing opportunity cost / specialised resources","outward shift = growth"]},
 {ch:"s0",q:"Distinguish positive and normative statements and classify: (a) 'A minimum wage increases unemployment among young workers.' (b) 'The government should raise the minimum wage.'",a:"Positive statements describe the world as it is and can be tested with evidence ('What is?'). Normative statements prescribe how the world ought to be and rest on value judgments. (a) is positive (testable, even if it might be wrong), (b) is normative.",k:["positive = descriptive, testable","normative = prescriptive, values","(a) positive, (b) normative"]},
 {ch:"s0",q:"Why do economists disagree? Give an example for each reason.",a:"1 Differences in scientific judgment: different views on validity of theories or size of parameters (e.g. how strongly saving reacts to taxes). 2 Differences in values: normative views on what policy should achieve (Peter and Paula well tax: tax by property, income or per capita?). 3 Perception vs. reality: economists largely agree (e.g. rent control reduces quantity and quality of housing; tariffs reduce welfare) but politicians still use such policies.",k:["scientific judgment","values (Peter and Paula)","perception vs reality (rent control, tariffs)"]},
 {ch:"s0",q:"Explain the problems of omitted variables and reverse causality with the examples from the lecture.",a:"Omitted variable: a graph shows households with more cigarette lighters develop more cancer, but the omitted variable is the number of cigarettes smoked, which causes both. Reverse causality: cities with more police have more crime; but it may be that crime-plagued cities hire more police, not that police cause crime. Both show that correlation in a graph does not prove causation.",k:["lighters and cancer: cigarettes omitted","police and crime: causality reversed","correlation is not causation"]},
 // s1
 {ch:"s1",q:"Explain absolute and comparative advantage using Frank (potato farmer) and Rose (rancher). Who should specialise in what, and why do both gain?",a:"Absolute advantage means producing with fewer inputs: Rose needs 20 min per oz of meat (Frank 60) and 10 min per oz of potatoes (Frank 15), so Rose has the absolute advantage in both. Comparative advantage is about opportunity cost: 1 oz of meat costs Rose 2 oz of potatoes and Frank 4 oz; 1 oz of potatoes costs Frank 1/4 oz of meat and Rose 1/2 oz. So Rose has the comparative advantage in meat and Frank in potatoes. If they specialise and trade (5 oz meat for 15 oz potatoes, i.e. 3 potatoes per meat, between 2 and 4), total production rises and both can consume outside their own PPF (A* and B*).",k:["absolute advantage: fewer inputs, Rose both","opportunity costs computed","Rose meat, Frank potatoes","price between opportunity costs","both consume more"]},
 {ch:"s1",q:"Why can one person have the absolute advantage in both goods but not the comparative advantage in both?",a:"Comparative advantage is based on opportunity cost. The opportunity cost of one good is the inverse of the opportunity cost of the other. If a person has a lower opportunity cost for good X, she must have a higher opportunity cost for good Y. Therefore, unless opportunity costs are identical, each person has the comparative advantage in exactly one good.",k:["based on opportunity cost","inverse relationship","lower in X means higher in Y"]},
 {ch:"s1",q:"Should Leonardo mow his own lawn? Use the example from the slides.",a:"Leonardo can mow his lawn in 2 hours or film a commercial and earn 20,000 dollars, so the opportunity cost of mowing is 20,000 dollars. Forrest needs 4 hours, and his alternative is working at McDonald's for 40 dollars. Even if Leonardo is faster (absolute advantage), Forrest has the comparative advantage in mowing. Leonardo should film the commercial and pay Forrest anything between 40 and 20,000 dollars; both gain.",k:["Leo's opportunity cost 20,000","Forrest's opportunity cost 40","Forrest comparative advantage","payment between 40 and 20,000"]},
 {ch:"s1",q:"Name and explain the sources of comparative advantage, including the Heckscher-Ohlin model.",a:"1 Differences in climate (bananas). 2 Differences in factor endowments: Heckscher-Ohlin model, a country with an abundant supply of a factor has a comparative advantage in goods intensive in that factor (Canada's forests, paper). Factor abundance = supply of a factor relative to other factors; factor intensity = quantity of a factor used relative to others. 3 Differences in technology (Swiss watches). Additionally increasing returns to scale drive trade, since efficient large producers concentrate in few places (aircraft in Seattle and Toulouse).",k:["climate","factor endowments / Heckscher-Ohlin","technology","increasing returns to scale"]},
 {ch:"s1",q:"Why did Hong Kong lose its comparative advantage in garments?",a:"Hong Kong got better at other things (e.g. finance, services). Its productivity there rose, so producing garments meant giving up more of those other goods: the opportunity cost of garments increased. Comparative advantage depends on relative, not absolute productivity, so it shifted to other countries.",k:["became better at other things","opportunity cost of garments rose","relative productivity"]},
 {ch:"s1",q:"A country opens up to trade and the world price is below the autarky price. Describe the effects on prices, quantities, consumer surplus, producer surplus and total surplus.",a:"The domestic price falls from PA to PW. Quantity demanded rises to QD, domestic quantity supplied falls to QS; the gap QD - QS is imported. Consumers gain surplus (areas X + Z), producers lose surplus (area X). Since consumer gains exceed producer losses, total surplus rises by area Z.",k:["price falls to world price","QD rises, QS falls","imports = QD - QS","CS +X+Z, PS -X","total surplus +Z"]},
 {ch:"s1",q:"How does international trade affect wages according to the Heckscher-Ohlin model? Use the US example.",a:"Countries export goods intensive in their abundant factors and import goods intensive in their scarce factors. Trade raises demand for abundant factors and lowers demand for scarce ones, so prices of abundant factors rise and of scarce factors fall. The US exports human-capital-intensive goods (high-tech designs) and imports unskilled-labor-intensive goods (clothing): wages of highly educated workers rise and wages of unskilled workers fall, so wage inequality increases.",k:["abundant vs scarce factors","factor prices","US skilled wages up, unskilled down","inequality rises"]},
 {ch:"s1",q:"Explain the effects of a tariff on an imported good. Which areas represent the deadweight loss and what do they mean?",a:"A tariff is a tax on imports. It raises the domestic price from PW to PW + tariff. Domestic production rises, domestic consumption falls, imports shrink. Consumer surplus falls by A + B + C + D, producer surplus rises by A, the government gains revenue C. Deadweight loss is B + D: B shows resources wasted on inefficient domestic production (the good is produced by the higher-cost producer), D shows mutually beneficial trades that no longer take place because consumers buy less.",k:["price rises","production up, consumption down, imports down","CS -(A+B+C+D), PS +A, revenue C","DWL = B + D","B inefficient production, D lost consumption"]},
 {ch:"s1",q:"Compare a tariff and an import quota.",a:"Both restrict imports, raise the domestic price, increase domestic production, reduce consumption and create a deadweight loss. The difference: with a tariff the government collects revenue; with a quota the area that would be revenue becomes 'quota rents' that go to the holders of import licenses, usually foreigners. So from a national perspective a quota is typically worse.",k:["same price and quantity effects","tariff: government revenue","quota: quota rents to license holders"]},
 {ch:"s1",q:"Discuss the arguments for trade protection and the economists' critique.",a:"National security: protect suppliers of crucial goods to be self-sufficient. Job creation: protection saves jobs, but economists argue they are offset by jobs lost elsewhere (e.g. export industries, retaliation, higher costs for users). Infant industry: new industries need temporary protection; critique: politically influential industries get it and governments are poor predictors of future winners. Generally protection raises prices for consumers and creates deadweight loss.",k:["national security","jobs argument and critique","infant industry and critique"]},
 // s2
 {ch:"s2",q:"Define GDP and explain each part of the definition.",a:"GDP is the market value of all final goods and services produced within a country in a given period of time. Market value: goods are valued at market prices. All: all items produced and sold legally in markets (excludes illegal and home production). Final: only final goods, since intermediate goods are already included in their price. Goods and services: tangible and intangible. Produced: only currently produced goods (no used goods). Within a country: domestic production regardless of the producer's nationality. Given period: a year or a quarter.",k:["market value","final goods (no double counting)","produced (current)","within a country","period"]},
 {ch:"s2",q:"Name the four components of GDP, explain each and state where purchases of new houses and transfer payments belong.",a:"Y = C + I + G + NX. Consumption: household spending on goods and services (except new housing). Investment: spending on capital equipment, inventories and structures, including households' purchases of new housing and inventory accumulation. Government purchases: spending on goods and services by all levels of government, NOT transfer payments. Net exports: exports minus imports. New houses count as investment; transfer payments (e.g. unemployment benefits) are not counted because no good or service is produced in exchange. Germany 2024: C 53%, I 21%, G 22%, NX 4%.",k:["Y = C + I + G + NX","new housing in I","transfers excluded from G","NX = X - M"]},
 {ch:"s2",q:"Explain the difference between nominal and real GDP and how the GDP deflator is calculated and used.",a:"Nominal GDP values production at current prices, real GDP at constant prices of a base year; in the base year both are equal. Nominal GDP can rise because of more output or higher prices, real GDP only because of more output, so real GDP measures growth. GDP deflator = nominal GDP / real GDP x 100; it is 100 in the base year and measures the price level relative to the base year. Inflation can be computed as the percentage change of the deflator, and nominal GDP can be 'deflated' with it.",k:["current vs constant prices","equal in base year","deflator formula","inflation from deflator"]},
 {ch:"s2",q:"Is GDP a good measure of well-being? Discuss.",a:"Pro: GDP measures total income and expenditure, and a larger GDP allows better health care, education and other inputs into a worthwhile life; rich countries have higher life expectancy, literacy and internet use (UK vs. Mexico vs. Mali). Contra: it excludes leisure, non-market activities (housework, childcare), the shadow economy, the quality of the environment (a factory's pollution) and says nothing about income distribution. So it is the best single measure, but not a perfect one.",k:["pro: income, inputs, correlation with quality of life","contra: leisure, home production, shadow economy, environment, distribution","conclusion"]},
 {ch:"s2",q:"Describe the five steps for calculating the CPI and the inflation rate.",a:"1 Fix the basket: determine which goods are important for the typical consumer and their weights. 2 Find the prices of each good at each point in time. 3 Compute the cost of the same basket in each year (isolates price changes). 4 Choose a base year and compute CPI = cost of basket in current year / cost in base year x 100. 5 Compute the inflation rate = (CPI year 2 - CPI year 1) / CPI year 1 x 100. Slide example: basket 4 hot dogs, 2 hamburgers costs 8, 14, 20 dollars, CPI 100, 175, 250, inflation 75% and 43%.",k:["fix basket","find prices","cost of basket","base year and index","inflation rate formula"]},
 {ch:"s2",q:"Why does the CPI overstate the cost of living? Explain the three problems.",a:"1 Substitution bias: prices do not change proportionately and consumers switch to goods that became relatively cheaper, but the fixed basket assumes they keep buying the expensive goods. 2 Introduction of new goods: more variety raises the value of a dollar, but new goods enter the basket late (cell phones introduced 1983, included 1998, upward bias of 0.8 to 1.9% in telecom). 3 Unmeasured quality change: better quality at the same price raises the value of a dollar, which the CPI often misses.",k:["substitution bias","new goods (cell phones)","quality change"]},
 {ch:"s2",q:"Compare the GDP deflator and the CPI.",a:"The GDP deflator is the ratio of nominal to real GDP and reflects prices of all goods and services produced domestically; it compares current production with the price of the same goods in the base year (changing basket). The CPI reflects prices of goods and services bought by consumers, including imports, and compares a fixed basket with its price in the base year. Investment goods appear only in the deflator, imported consumer goods only in the CPI. In practice both measures generally move together.",k:["deflator: all domestic production","CPI: consumer basket incl. imports","fixed vs changing basket","move together"]},
 {ch:"s2",q:"Explain the real-nominal principle and the difference between nominal and real interest rates. What happens during deflation?",a:"What matters is the real value of money or income, i.e. its purchasing power, not its face value. The nominal interest rate is the rate as reported, without correction for inflation; the real interest rate corrects for inflation: real = nominal - inflation. During inflation the real rate is below the nominal rate; during deflation it exceeds the nominal rate. Indexation and COLAs automatically correct payments for inflation.",k:["purchasing power","real = nominal - inflation","deflation: real > nominal"]},
 // s3
 {ch:"s3",q:"Name and explain the four determinants of productivity and why productivity matters.",a:"Productivity is the quantity of goods and services produced from each unit of labor input. It is the key determinant of living standards and its growth determines growth in living standards, since an economy's income equals its output. Determinants: physical capital per worker (equipment and structures), human capital per worker (knowledge and skills from education, training, experience), natural resources per worker (land, rivers, minerals), technological knowledge (society's understanding of the best ways to produce).",k:["definition","living standards","physical capital","human capital","natural resources","technology"]},
 {ch:"s3",q:"Explain diminishing returns and the catch-up effect. Does a higher saving rate permanently raise growth?",a:"Diminishing returns: the benefit of an extra unit of an input declines as the quantity of the input increases; the production function (output per worker over capital per worker) gets flatter. A higher saving rate means more capital, higher productivity and faster growth for a while, but in the long run only a higher level of productivity and income, not a higher growth rate. Catch-up effect: poor countries have little capital, so small investments raise productivity a lot; countries that start poor tend to grow faster than rich ones.",k:["definition diminishing returns","saving raises level not long-run growth","catch-up: poor countries grow faster"]},
 {ch:"s3",q:"Why are property rights and political stability important for economic growth? Use the Peru example.",a:"Property rights let people exercise authority over their resources; they are a prerequisite for the price system and are enforced by courts. Without them contracts are hard to enforce, fraud goes unpunished, corruption impedes markets and discourages saving and foreign investment. Political instability (revolutions, coups, confiscation) reduces incentives to save, invest and start businesses. Peru: without clear title, land cannot be used as collateral, so farmers cannot borrow to switch from coca paste to profitable palm oil, which needs financing.",k:["property rights enable markets and contracts","corruption","instability reduces investment","Peru: no title, no collateral, no loans"]},
 {ch:"s3",q:"Define recession, peak, trough, expansion and depression and describe the three key features of economic fluctuations.",a:"Recession: commonly two consecutive quarters of declining real GDP (lower income, rising unemployment, falling profits, bankruptcies). Peak: the date the recession starts. Trough: the date output stops falling. Expansion: recovery after the trough. Depression: a severe recession. Features: 1 co-movement: consumption, investment and employment move with real GDP, unemployment against it; 2 limited predictability: no repetitive pattern, end of a phase cannot be forecast; 3 persistence: growth or contraction tends to continue into the next quarter.",k:["definitions","co-movement","limited predictability","persistence"]},
 {ch:"s3",q:"Why are there economic fluctuations, and why does output fall more when wages are downward rigid?",a:"Causes: technology shocks, changing sentiments, monetary or financial factors. At the start of a recession labor demand shifts left because of lower output prices, lower demand, lower productivity or higher input prices. With flexible wages the wage falls and employment falls somewhat. If wages are downward rigid the wage stays the same, so the whole adjustment happens in quantity: employment falls more, and output falls more than with flexible wages.",k:["causes","labor demand shifts left","flexible: wage falls","rigid: larger fall in employment and output"]},
 {ch:"s3",q:"Define employed, unemployed, not in the labor force, labor force and unemployment rate. Classify a full-time student who is not looking for work.",a:"Employed: people who work (paid, self-employed, unpaid in family business, full or part-time, temporarily absent). Unemployed: without a job, available and actively looking. Not in the labor force: neither (full-time students, homemakers, retirees). Labor force = employed + unemployed. Unemployment rate = unemployed / labor force x 100. A full-time student not looking for work is not in the labor force.",k:["employed","unemployed: actively looking","not in labor force","formulas","student classified correctly"]},
 {ch:"s3",q:"Explain the four types of unemployment and which require policy action.",a:"Frictional: workers and firms need time to search and match; healthy, no action needed. Structural: mismatch of skills and jobs (technological change, international competition, resource depletion) or wages above equilibrium; needs action such as retraining. Seasonal: due to weather and seasons; neutral, no action. Cyclical: caused by business cycle fluctuations in real GDP; unhealthy, addressed with fiscal or monetary policy. The natural rate consists of frictional, structural and seasonal unemployment (no cyclical).",k:["frictional","structural + retraining","seasonal","cyclical + fiscal/monetary policy","natural rate"]},
 {ch:"s3",q:"Explain how minimum wages and unions can cause unemployment. Are unions good or bad for the economy?",a:"If a minimum wage is set above the equilibrium wage WE, the quantity of labor supplied rises to LS and the quantity demanded falls to LD; the surplus LS - LD is unemployment (structural). Unions bargain wages above equilibrium (US union members earn 10-20% more), reducing employment. Insider-outsider theory: protected insiders gain while outsiders stay unemployed. Pro unions: counterweight to firms' market power, better wages and conditions, happier and more productive workforce. Contra: a cartel, inefficient allocation of labor, inequitable since some workers gain at the expense of others.",k:["wage above equilibrium: surplus","LS - LD","union wage premium","insider-outsider","pros and cons"]},
 {ch:"s3",q:"What is the theory of efficiency wages? Explain with Ford's 5-dollar day.",a:"Firms deliberately pay above equilibrium because it raises productivity: better worker health (better diet), lower turnover, higher worker quality (better applicant pool), higher effort (fear of losing a good job). Ford in 1914 paid 5 dollars a day, twice the going wage. On the assembly line workers were highly interdependent, so effort mattered. Turnover and absenteeism fell, productivity rose, and production costs were lower despite higher wages, so it was profitable.",k:["four reasons","Ford 1914, twice the wage","turnover/absenteeism fell","profitable"]},
 // s4
 {ch:"s4",q:"Explain the three functions of money and the problem money solves.",a:"Medium of exchange: an item buyers give sellers for goods and services; it solves the double coincidence of wants problem of barter. Unit of account: a standard unit in which prices are stated and values compared. Store of value: money preserves value until used in an exchange (weakened by inflation).",k:["medium of exchange","unit of account","store of value","barter / double coincidence of wants"]},
 {ch:"s4",q:"Define M1 and M2.",a:"M1 is the sum of currency in circulation and overnight deposits (demand deposits and other liquid deposits). M2 is M1 plus deposits with an agreed maturity of up to two years plus deposits redeemable at notice of up to three months (in the US also small time deposits and money market funds). US November 2021: M1 about 20.3 trillion, M2 about 23.4 trillion dollars.",k:["M1: currency + overnight deposits","M2: M1 + time deposits up to 2y + notice up to 3m"]},
 {ch:"s4",q:"How do banks create money? Explain the money multiplier and why the real-world multiplier is smaller.",a:"With fractional reserve banking banks keep only a fraction R of deposits as reserves and lend the rest. The loan is deposited at another bank, which again lends out all but R, and so on. Each round creates new deposits, i.e. money (but not wealth). The money multiplier is 1/R: with R = 10% one dollar of reserves supports 10 dollars of money. In reality people hold part of loans as cash and banks hold excess reserves (strongly after 2008, when the Fed injected reserves and paid interest on them), so less money is created. With 100% reserve banking banks would not influence the money supply.",k:["fractional reserves","lending and redepositing","multiplier = 1/R","cash holding and excess reserves reduce it"]},
 {ch:"s4",q:"What is a central bank and what does it do? Describe the Fed and the ECB.",a:"A central bank is a government institution that monitors financial institutions, controls key interest rates and indirectly controls the money supply (monetary policy). The Fed has a Board of Governors (appointed by the president, confirmed by the Senate) and 12 regional banks; decisions are taken by the FOMC (Board plus five regional presidents). The ECB was created in January 1999 when 11 countries adopted the euro; it is in Frankfurt and runs monetary policy for the euro area as a combined economy.",k:["functions","Fed structure / FOMC","ECB 1999, Frankfurt"]},
 {ch:"s4",q:"Define the nominal exchange rate as on the slides and explain appreciation and depreciation.",a:"The nominal exchange rate is the rate at which one currency can be exchanged for another. On the slides e = units of foreign currency per one unit of domestic currency (1/e = domestic per foreign). An increase of e means the domestic currency buys more foreign currency: appreciation. A decrease of e: depreciation. Example 19 January 2022 for the US: e = 0.88 euro per dollar, 1/e = 1.13 dollars per euro.",k:["e = foreign per domestic","rise = appreciation","fall = depreciation"]},
 {ch:"s4",q:"How is the dollar-euro exchange rate determined in a flexible system? What happens if US interest rates rise or European prices fall?",a:"In the foreign exchange market the price is the exchange rate. Demand for dollars (traders buying dollars with euros) slopes downward; supply of dollars (selling dollars for euros) slopes upward. Equilibrium where they meet. Higher US interest rates or lower US prices raise demand for dollars: the dollar appreciates. Higher European interest rates or lower European prices raise the supply of dollars (people want euro assets/goods): the dollar depreciates. So lower European prices depreciate the dollar.",k:["supply and demand for dollars","US rates up: demand up, appreciation","EU prices down: supply of dollars up, depreciation"]},
 {ch:"s4",q:"Define the real exchange rate and explain its effect on trade. What happens if China keeps the yuan undervalued?",a:"The real exchange rate compares the price of a basket in two countries in the same currency: E = (dollar price of US basket x e) / yuan price of Chinese basket, with e in yuan per dollar. If E rises, US goods become relatively more expensive: US exports fall, imports from China rise. An undervalued yuan raises E: US trade deficit, Chinese surplus, and lower US employment (Y = C + I + G + X - M). The Fed could use expansionary monetary policy: lower US rates make Chinese investors hold fewer US assets, demand for dollars falls, E falls and US net exports rise.",k:["formula","higher E: fewer exports, more imports","undervalued yuan: US deficit, lower employment","Fed response"]},
 {ch:"s4",q:"What were the fundamental causes of the problems of the euro?",a:"The euro (1999) aimed at economic and political unification. Capital flowed into Spain and Ireland, fuelling unsustainable housing booms, and excessive lending went to Greece, Italy and Portugal with budget problems. After the 2007 recession, banks and governments could not pay their debts, and with a single currency they could not adjust through depreciation. Options were transfers from Germany or harsh budget cuts and unemployment to reduce wages. Lesson: a monetary union without a common fiscal system (as the US has) is hard to sustain.",k:["capital flows and booms","debt crisis after 2007","no depreciation possible","missing fiscal union"]},
 // s5
 {ch:"s5",q:"Why was classical macroeconomics inadequate for the Great Depression and what did Keynes change?",a:"Classical economics assumed the short run is unimportant, prices are flexible and aggregate supply is vertical, so money only affects prices and the economy self-corrects. The Great Depression showed that the short run matters; there was no business cycle theory and advice was conflicting. Keynes (General Theory, 1936) shifted the focus to the short run: changes in aggregate demand affect output, and 'animal spirits' (business confidence) cause the cycle. This legitimised policy activism: using fiscal and monetary policy to smooth the cycle (Roosevelt's 1937 budget balancing caused a renewed slump).",k:["classical assumptions","Depression showed short run matters","AD affects output","animal spirits","policy activism"]},
 {ch:"s5",q:"Compare the classical and the Keynesian view of short-run aggregate supply and the effect of an AD shift.",a:"Classical view: SRAS is vertical, so a shift in AD changes only the price level, not output. Keynesian view: SRAS is upward sloping, so a shift in AD changes both the price level and output.",k:["classical vertical: only prices","Keynesian upward: prices and output"]},
 {ch:"s5",q:"Explain monetarism. How does Friedman agree and disagree with Keynes?",a:"Friedman and Schwartz (1963) argued that business cycles were associated with fluctuations in the money supply and the Depression could have been avoided had the Fed increased the monetary base. Monetarists claim activist policy only makes things worse, GDP grows steadily if money grows steadily, so the economy should be managed with a non-activist monetary policy rule (autopilot). Like Keynes: the short run is important, AD affects output and prices, policy should have been more expansionary in the Depression. Unlike Keynes: any activist fiscal or monetary policy made things worse because of time lags.",k:["money supply drives cycles","policy rule / autopilot","agrees: short run, AD matters","disagrees: activism harmful, time lags"]},
 {ch:"s5",q:"What is the natural rate hypothesis and how did rational expectations change it?",a:"Friedman and Phelps: any attempt to keep unemployment below a minimum (natural) level leads to ever-rising inflation; the 1970s confirmed it. So governments should only stabilise unemployment around the natural rate. Original hypothesis: pushing unemployment below the natural rate works in the short run but fails eventually. Rational expectations: people use all available information (e.g. in wage bargaining), so the attempt fails immediately; Lucas: monetary policy affects output only if it comes as a surprise.",k:["below natural rate: accelerating inflation","1970s","rational expectations: fails immediately","Lucas surprise"]},
 {ch:"s5",q:"Explain real business cycle theory and New Keynesian economics.",a:"Real business cycle theory (new classical): cycles are caused by fluctuations in productivity growth, not demand shocks; data suggest demand shocks also matter. New Keynesian economics (1990s): market imperfections make many prices temporarily sticky, so expected inflation cannot rise quickly enough to offset activist policy; policy can therefore affect output.",k:["RBC: productivity shocks","data: demand shocks matter","NK: sticky prices","policy effective"]},
 {ch:"s5",q:"What is a political business cycle? Give the example from the lecture.",a:"The political use of macroeconomic policy to serve political ends: politicians pump up the economy before an election and pay the price in higher inflation or unemployment later. Nixon used expansionary fiscal and monetary policy before the 1972 election, which led to rapid growth and then sharp acceleration of inflation; Rogoff called him 'the all-time hero of political business cycles'. It is an argument for independent central banks.",k:["definition","Nixon 1972","inflation afterwards"]},
 {ch:"s5",q:"How did events since 2008 change macroeconomic thinking about monetary policy, fiscal policy and debt?",a:"During the Great Moderation (1985-2007) economists believed monetary policy could stabilise the economy. In 2008 cutting rates to zero did not prevent a severe recession and recovery was slow; even unconventional policy fell short. This revived fiscal policy (stimulus). Austerity in 2010-2013 showed that deeper cuts led to worse performance (about 1.50 dollars of GDP lost per dollar cut). With secular stagnation (low population growth, slow technical progress) rates stay near zero: debt matters less because the debt-to-GDP ratio shrinks when interest rates are below growth, but central banks have little room to cut, so automatic stabilizers should be strengthened.",k:["Great Moderation belief","2008: zero rates insufficient","fiscal revival, austerity evidence","secular stagnation","debt-to-GDP and automatic stabilizers"]},
 {ch:"s5",q:"Why was the 2020 Covid recession not a normal recession and what was learned?",a:"It was very severe and very short, caused by the pandemic and public health measures that banned or restricted activities, not by a normal demand or financial shock. Supply and demand for goods with usually stable prices were disrupted. Lifting restrictions and vaccines brought a quick return of employment, accompanied by a surge in inflation. Lesson: the economy is less flexible in the short run than hoped, but the AD-AS framework was not called into question.",k:["pandemic and restrictions","short and severe","rapid recovery with inflation","economy less flexible"]},
 // r1
 {ch:"r1",q:"Explain how arbitrage links exchange rates and goods prices in the long run.",a:"In the long run goods markets adjust and the exchange rate is determined by price differences between countries. If a good is cheaper in the US, European consumers want to buy there and need dollars: demand for dollars rises and the dollar appreciates. As the dollar appreciates the advantage of buying in the US declines. Arbitrage (exploiting price differences for profit) continues until prices in the two markets converge.",k:["price difference","demand for currency rises","appreciation","prices converge"]},
 {ch:"r1",q:"What is the Balassa-Samuelson effect?",a:"Productivity-biased purchasing power parity: consumer prices are systematically higher in more developed countries. Arbitrage works only for tradable goods (high productivity sector), so their prices are equalised internationally, but not for non-tradables (stagnant productivity, e.g. services). Rich countries have high productivity and wages in tradables, which also raise wages and prices of non-tradables.",k:["prices higher in rich countries","tradables equalised","non-tradables not","productivity differences"]},
 {ch:"r1",q:"Compare converting GDP with market exchange rates and with purchasing power parity.",a:"Market exchange rate: nominal GDP is converted at the current market rate (e.g. 1 USD = 64.76 rupees); this ignores differences in the cost of living. PPP: currencies are compared with a basket of goods, so GDP reflects what income can actually buy; useful to compare productivity and living standards. Since non-traded goods are cheaper in low-income countries, real income there can be several times higher than nominal GDP suggests (with PPP China, 25.3 trillion USD, leads the US, 20.5 trillion).",k:["market rate ignores cost of living","PPP basket approach","non-tradables cheaper in poor countries","China vs US example"]},
 {ch:"r1",q:"Explain the Big Mac example from the slides: what does it show about the yen and the euro, and what are the drawbacks of the index?",a:"With a weekly budget of 35 dollars a student buys 4.9 Big Macs in Germany (7.08 dollars each) but 11.4 in Japan (3.08 dollars). A Big Mac costs 2.3 times more in Germany. Valued at German prices, the Japanese basket is worth about 80 dollars. So at market rates the yen is undervalued and the euro overvalued. Drawbacks: prices include non-traded inputs like labor, so they do not only reflect currency values; McDonald's is not in every country (e.g. parts of Africa); the index is a single item and lacks the diversity of a CPI (The Economist also publishes a GDP-adjusted version).",k:["4.9 vs 11.4","yen undervalued, euro overvalued","non-traded inputs","limited reach","single item"]},
 // r2
 {ch:"r2",q:"A tax of 0.50 per ice-cream cone is levied on sellers. Price rises from 3.00 to 3.30, quantity falls from 100 to 90. Explain the effects on buyers, sellers, government and welfare.",a:"The supply curve shifts up by 0.50. Buyers now pay 3.30 (+0.30), sellers receive 3.30 - 0.50 = 2.80 (-0.20), so both share the burden even though the tax is levied on sellers. Tax revenue = 0.50 x 90 = 45. Consumer and producer surplus fall by more than the revenue; the difference is the deadweight loss = 0.5 x 0.50 x 10 = 2.50 (the 10 cones that are no longer traded).",k:["buyers 3.30, sellers 2.80","burden shared","revenue 45","deadweight loss 2.50"]},
 {ch:"r2",q:"What are network externalities? Explain the bandwagon and snob effect.",a:"A network externality exists when each individual's demand depends on the purchases of others (telephone: useless if nobody else has one). Positive: bandwagon effect, a consumer wants a good partly because others have it (fashion), so demand grows with the number of users. Negative: snob effect, a consumer wants an exclusive good, so quantity demanded falls as more people own it (rare art, custom sports cars).",k:["definition","bandwagon positive","snob negative","examples"]},
 {ch:"r2",q:"Using the burger demand schedule (A: P 9, Q 2; B: P 8, Q 4), calculate the price elasticity from A to B with the simple and the midpoint method and explain why they differ.",a:"Simple: (2/2) / (-1/9) = 1 / -0.111 = -9. Midpoint: change in Q / average Q = 2/3 = 0.667; change in P / average P = -1/8.5 = -0.118; elasticity = -5.67. The simple method depends on the starting point (reversing direction gives a different value), the midpoint method uses averages and gives the same result in both directions. Elasticity is a pure number (the % sign on the slide is misleading). The top of a linear demand curve is more elastic than the bottom.",k:["-9","-5.67","midpoint symmetric","elasticity varies along linear demand"]},
 {ch:"r2",q:"What conditions are needed for price discrimination?",a:"Market power (the firm can set prices), different consumer groups with different willingness to pay that can be identified, and no possibility of resale (otherwise arbitrage would undo the price difference).",k:["market power","different groups","no resale"]},
 {ch:"r2",q:"Explain public goods and the free-rider problem. How can the government solve it?",a:"Public goods are not excludable: nobody can be prevented from using them, so they are available free of charge. Free riders enjoy the benefit without paying, so private markets will not supply them. If the total benefit exceeds the cost, the government can provide the good and pay for it with tax revenue, making everyone better off.",k:["non-excludable","free riders","no private supply","government provides, taxes"]},
 // r3
 {ch:"r3",q:"Why does the aggregate demand curve slope downward? Explain the three effects.",a:"1 Wealth effect: with a given money supply, a higher price level lowers the real value of people's assets, so they consume less. 2 Interest rate effect: higher prices raise the demand for money; with a fixed money supply the interest rate rises, borrowing gets more expensive, consumption and investment fall. 3 Net exports effect: a higher domestic price level makes foreign goods relatively cheaper, imports rise and exports fall. In all three cases a higher price level reduces the quantity of real GDP demanded.",k:["wealth effect","interest rate effect","net exports effect"]},
 {ch:"r3",q:"Would aggregate demand increase or decrease: (1) stock market boom, (2) lower government spending, (3) lower taxes, (4) printing more money, (5) fear of recession, (6) higher incomes of a trading partner? Which raise inflation?",a:"(1) increase (wealth), (2) decrease, (3) increase (more disposable income), (4) increase (lower interest rates), (5) decrease (lower confidence), (6) increase (more exports). Increases in AD (1, 3, 4, 6) raise the price level and thus inflationary pressure in the short run; decreases lower it.",k:["1 up","2 down","3 up","4 up","5 down","6 up","AD up raises inflation"]},
 {ch:"r3",q:"Would short-run aggregate supply increase or decrease: (1) higher nominal wages, (2) more liquid capital, (3) new robotic technology, (4) lower taxes on producers, (5) higher expected inflation, (6) more immigration?",a:"(1) decrease (higher costs), (2) increase, (3) increase (productivity), (4) increase (lower costs), (5) decrease (suppliers hold back / wages rise), (6) increase (more labor). A decrease of SRAS raises prices (cost-push inflation) and lowers output; an increase lowers prices.",k:["1 down","2 up","3 up","4 up","5 down","6 up"]},
 {ch:"r3",q:"Explain the long-run aggregate supply curve and what shifts it.",a:"In the long run the quantity of goods supplied does not depend on the price level: input prices adjust proportionally, so firms have no incentive to change output. LRAS is vertical at the natural level of real GDP. A rise in AD only raises prices in the long run. LRAS shifts right with more productive resources (labor, capital, cheaper raw materials) and better technology.",k:["vertical","independent of price level","natural output","shifts: resources and technology"]},
 {ch:"r3",q:"What is the fiscal multiplier? What weakens it?",a:"Fiscal policy changes government spending or taxes to stabilise the economy. One euro of spending raises GDP by more than a euro because it becomes income for others, who spend part of it again (ALDI cashier, hairdresser, plane ticket). If people save instead of spending, the multiplier is smaller. Also the government has to borrow (from domestic savers or abroad), which may crowd out private spending.",k:["spending becomes income","multiplier > 1","saving reduces it","borrowing"]},
 // r4
 {ch:"r4",q:"Explain the difference between GDP and GNP using the example of a Japanese car factory in the UK. Why is Ireland's GDP 'misleading'?",a:"GDP counts production within the country; GNP = GDP + net income from abroad (dividends, interest, profits). A Japanese factory in the UK adds to UK GDP. If it sends 50 million pounds in profits to Japanese shareholders, this outflow is subtracted from UK GNP, though GNP still rises because UK workers earn wages. Countries with many multinationals that repatriate profits have GNP well below GDP (Luxembourg 87,400 vs. 45,360). Ireland's GDP is inflated by multinationals' profits booked there, so it overstates the income of Irish residents.",k:["GDP domestic production","GNP adds net factor income","profit outflow lowers GNP","Ireland multinationals"]},
 {ch:"r4",q:"What does the current account consist of and what does a deficit mean? Is a deficit necessarily bad?",a:"Current account = exports of goods and services + income receipts - imports - income payments - net unilateral transfers. A surplus means the nation is a net lender to the rest of the world; a deficit means it is a net borrower and must be financed by a financial account surplus (selling assets to foreigners). A deficit is not necessarily bad: it can reflect investment-driven imports or attractive conditions for foreign capital (e.g. US). It becomes a problem if it is financed by short-term debt, reflects lost competitiveness, or capital inflows stop, which can cause a sharp depreciation.",k:["components","deficit = net borrower","financed by financial account","not necessarily bad, with reasons"]},
 {ch:"r4",q:"Classify the transactions: (a) you send money to your family overseas, (b) dividends from a Japanese stock, (c) the Chinese government buys a German bond, (d) the Bundesbank buys US dollars, (e) you buy a holiday home in Turkey.",a:"(a) Unilateral transfer (current account, debit). (b) Income receipt (current account, credit): the income, not the asset. (c) Asset transaction: capital inflow to Germany (financial account, credit). (d) Asset transaction / official reserves (financial account, outflow). (e) On the slide classified as goods/services; strictly in BOP terms a real estate purchase abroad is an asset purchase (financial account, outflow).",k:["(a) transfer","(b) income","(c) financial account inflow","(d) reserves / financial account","(e) note the classification"]},
 {ch:"r4",q:"Define net capital outflow and name the factors influencing it.",a:"Net capital outflow = purchase of foreign assets by domestic residents - purchase of domestic assets by foreigners. Example: a UK resident buying BMW shares raises UK NCO, a Japanese resident buying UK government bonds lowers it. Influences: real interest rates on foreign assets, real interest rates on domestic assets, perceived economic and political risks of holding assets abroad, and government policies affecting foreign ownership.",k:["definition","examples","interest rates","risk","policies"]},
 {ch:"r4",q:"What happens to a currency if a country runs a current account deficit but cannot attract capital inflows?",a:"More money flows out (for imports) than comes in: the supply of the domestic currency on the FX market exceeds demand, so the currency depreciates. Exports become cheaper and imports more expensive, which eventually reduces the current account deficit. Example: the UK found it harder to attract capital flows, and the pound fell.",k:["supply of currency exceeds demand","depreciation","exports cheaper","deficit shrinks"]},
 // r5
 {ch:"r5",q:"Explain the difference between a floating and a fixed exchange rate system.",a:"Floating: the rate is determined by supply and demand on the private market and changes constantly; low demand lowers the value, making imports dearer and stimulating domestic demand and jobs (auto-correction). Fixed (pegged): the central bank sets an official rate against a major currency and maintains it by buying and selling its own currency; it needs large foreign reserves; it creates stability for foreign investment but gives up monetary flexibility.",k:["floating: market","fixed: central bank intervention","reserves needed","pros/cons"]},
 {ch:"r5",q:"Name and explain three factors that change the demand and supply of a currency, with the examples from the slides.",a:"1 Expectations: if investors expect the peso to rise, demand shifts right, supply left, the peso appreciates (10 to 12 cents). 2 Rates of return: higher US interest rates relative to Mexico raise demand for dollars and reduce supply; the dollar appreciates (8 to 9 pesos). 3 Relative inflation: Argentina with over 200% inflation saw demand for pesos fall and supply rise; the peso depreciated from 2.50 to 0.50 euro. Further: government debt, current account deficit, political stability, speculation, tastes, trade barriers, recession.",k:["expectations","interest rates","relative inflation","examples"]},
 {ch:"r5",q:"If the EU significantly increases its imports from Peru, what happens to the euro and the sol, and why?",a:"To pay for Peruvian goods EU importers must buy soles with euros. Demand for the sol rises and the supply of euros on the FX market rises. The sol appreciates against the euro and the euro depreciates against the sol. So statement 3 ('the sol will appreciate') is correct.",k:["demand for sol up","supply of euros up","sol appreciates, euro depreciates"]},
 {ch:"r5",q:"Euro vs. yen table: what happens to each currency when (1) German tourists love Japan, (2) Germany cuts income taxes, (3) higher inflation in Japan, (4) higher interest rates in Japan, (5) Japan places tariffs on German products, (6) Germany enters a recession?",a:"(1) Germans need yen: supply of euros up, demand for yen up; euro depreciates, yen appreciates. (2) Higher German incomes, more imports from Japan: same as 1, euro depreciates. (3) Japanese goods less attractive, yen loses purchasing power: yen depreciates, euro appreciates. (4) Capital flows to Japan: demand for yen up, yen appreciates, euro depreciates. (5) Fewer German exports to Japan: lower demand for euros, euro depreciates, yen appreciates. (6) German recession: Germans import less (less supply of euros), but interest rates fall and capital leaves; on the slides recession leads to a weaker currency: euro depreciates.",k:["1 euro down","2 euro down","3 yen down","4 yen up","5 euro down","6 euro down (slides)"]},
 // r6
 {ch:"r6",q:"Germany can produce 2000 planes or 200 cruise ships per month, France 1200 planes or 200 ships. Who has the absolute and the comparative advantage in planes and ships, and what are acceptable terms of trade?",a:"Absolute advantage in planes: Germany (2000 > 1200); ships: equal (200 each). Opportunity cost of a plane: Germany 200/2000 = 0.1 ship, France 200/1200 = 0.167 ship, so Germany has the comparative advantage in planes. Opportunity cost of a ship: Germany 10 planes, France 6 planes, so France has the comparative advantage in ships. Germany should give up producing ships. Terms of trade: one ship must cost between 6 and 10 planes (or a plane between 0.1 and 0.167 ships).",k:["absolute: Germany planes","opp cost plane 0.1 vs 0.167","Germany planes, France ships","1 ship between 6 and 10 planes"]},
 {ch:"r6",q:"What does the shape of the PPF tell us and how is it linked to the law of diminishing returns?",a:"The PPF shows maximum output combinations when resources are fully and efficiently employed; points inside (Z) mean unused resources, points outside (W) are unattainable unless resources or technology change. The law of diminishing returns says adding more of one factor while others are fixed yields ever smaller increases in output. Shifting resources into good X therefore yields less and less X per unit of Y given up: the opportunity cost of X rises and the PPF is bowed outward.",k:["inside/outside","diminishing returns definition","rising opportunity cost","bowed out"]},
 {ch:"r6",q:"What are the limitations of Ricardo's comparative advantage theory?",a:"Trade barriers and transport, storage and distribution costs; specialisation can cause structural unemployment when workers cannot move between sectors; non-renewable resources can run out, raising costs and reducing gains; the real world has more than two countries and goods; countries can develop new advantages over time.",k:["transport costs / barriers","structural unemployment","resources run out","2x2 simplification","advantages change"]},
 // r7
 {ch:"r7",q:"State the Heckscher-Ohlin theorem and its assumptions. How is factor abundance defined?",a:"In a 2x2x2 model (2 countries, 2 goods, 2 factors K and L) each country exports the good that intensively uses its abundant factor and imports the good intensive in its scarce factor. Abundance is measured by ratios: if (K/L)A > (K/L)B, A is capital abundant, even if B has more capital in absolute terms. Assumptions: identical production technologies (switchable within a country) and identical preferences; countries differ only in factor endowments. Example: capital-abundant country exports computers, labor-abundant country exports shoes.",k:["export good using abundant factor","ratio K/L","same technology","same preferences"]},
 {ch:"r7",q:"What is the Leontief paradox and how was it resolved?",a:"Leontief found that the US, the most capital-abundant country, exported labor-intensive goods and imported capital-intensive goods, contradicting H-O. Resolution: splitting labor into skilled and unskilled labor; the US exports skilled-labor-intensive and imports unskilled-labor-intensive goods. It also shows that H-O ignores factors like technology.",k:["US exported labor-intensive goods","contradiction","skilled vs unskilled labor"]},
 {ch:"r7",q:"Using the H-O model, explain why low-income workers may lose from trade.",a:"Trade raises demand for each country's abundant factor and lowers demand for its scarce factor. In rich countries unskilled labor is scarce: imports of unskilled-labor-intensive goods reduce demand and wages for low-skilled workers, while skilled workers and capital owners gain. This distributional effect explains the backlash against globalisation; mitigation through retraining and redistribution.",k:["abundant factor gains, scarce loses","unskilled labor scarce in rich countries","backlash"]},
 // r8
 {ch:"r8",q:"Sugar market Montenegro (Qd = 14 - P, Qs = P, millions of kg). World price 2 EUR. How much is imported? A tariff raises the price to 4 EUR: calculate domestic production, imports, tariff revenue and deadweight loss.",a:"At 2 EUR: Qd = 12, Qs = 2, imports = 10. At 4 EUR: Qd = 10, Qs = 4, imports = 6. Tariff revenue = 2 x 6 = 12 million EUR. Consumer surplus falls from 72 to 50 (-22), producer surplus rises from 2 to 8 (+6). Deadweight loss = 0.5 x 2 x 2 + 0.5 x 2 x 2 = 4 million EUR (22 = 6 + 12 + 4). So producers' gain does not offset consumers' loss.",k:["imports 10","production 4, imports 6","revenue 12","DWL 4","CS -22, PS +6"]},
 {ch:"r8",q:"List the instruments of trade policy and classify them.",a:"Reduce trade: price instruments tariffs and export taxes; volume instruments import quotas and voluntary export restraints (VER). Increase trade: price instruments export subsidies and import subsidies; volume instrument voluntary import expansion (VIE).",k:["tariffs, export tax","quota, VER","export/import subsidy","VIE"]},
 {ch:"r8",q:"Explain the three types of tariffs with examples.",a:"Specific tariff: fixed charge per unit (3 EUR per barrel of oil). Ad valorem tariff: a percentage of the value (12% on textile clothing or trucks into the EU). Compound (mixed) tariff: combines or stages charges (21 EUR per kg wine up to 18% vol., 35 EUR above).",k:["specific","ad valorem","compound"]},
 // r9
 {ch:"r9",q:"What is the WTO, what is the most-favoured-nation clause, and what criticism exists?",a:"The WTO ensures that global trade flows smoothly, freely and predictably and sets ground rules and a dispute system. MFN: any concession granted to one member must be granted to all other members (5% tariff cut for one means for all). Criticism: lack of transparency, compromised national sovereignty, regulations to protect workers or environment can be seen as barriers, and patent rules can prevent poor countries from producing affordable generic drugs (HIV).",k:["purpose","MFN definition","criticism"]},
 {ch:"r9",q:"Explain trade diversion and why it is considered undesirable.",a:"Trade diversion occurs when a free trade agreement or customs union diverts imports from a more efficient (low-cost) non-member to a less efficient (higher-cost) member because only the non-member faces tariffs. It concentrates production in countries with higher opportunity cost, distorts comparative advantage and contradicts the aims of the WTO.",k:["from efficient to less efficient","common external tariff","distorts comparative advantage"]},
 {ch:"r9",q:"What is the ECB's objective and which instruments does it use? How should it react to a recession and to inflation?",a:"Primary objective: price stability, inflation below but close to 2% over the medium term (since 2021 a symmetric 2% target); the Governing Council decides every six weeks. Instruments: open market operations (MRO rate), standing facilities (deposit facility rate and marginal lending facility rate), minimum reserve requirements. Recession: increase money supply, cut interest rates, lower reserve requirements: more investment and AD. Inflation: the opposite. Higher rates also attract capital inflows and appreciate the euro, affecting the BOP.",k:["price stability 2%","three instruments","recession: lower rates","inflation: higher rates","capital flows"]},
 {ch:"r9",q:"Order the stages of economic integration and explain each.",a:"Preferential trade area: reduced (not abolished) tariffs for certain products. Free trade area: no tariffs among members, own external tariffs (NAFTA). Customs union: plus a common external tariff. Common (single) market: plus free movement of labor and capital (EU). (Free trade area, customs union and common market definitions are standard textbook content; the slides list the names.)",k:["PTA","FTA","customs union","common market"]},
 // r10
 {ch:"r10",q:"What is an optimum currency area? Name the four criteria.",a:"OCA theory states that regions sharing certain traits should share a common currency, which leads to greater efficiency. Criteria: 1 a large integrated labor market where workers move freely; 2 flexible prices and wages plus capital mobility to eliminate regional imbalances; 3 a centralised budget to redistribute to suffering regions (politically difficult); 4 similar business cycles to avoid shocks in one area.",k:["definition","labor mobility","flexible prices/wages, capital","central budget","similar cycles"]},
 {ch:"r10",q:"What are the advantages and disadvantages of Ecuador's dollarisation?",a:"Before 2000 constant inflation and recessions made the sucre's exchange rate unpredictable, making trade difficult. With the US dollar, Ecuador has kept low and stable inflation. Disadvantages: Ecuador can no longer print money, has no independent monetary policy (the Fed decides) and cannot react to shocks by devaluing.",k:["stability, low inflation","easier trade","no own monetary policy","no devaluation"]},
 {ch:"r10",q:"Using the Greece olive oil example, explain external vs. internal devaluation.",a:"With the drachma: if German demand for olive oil falls, demand for drachmas falls and the drachma depreciates (1 drachma = 0.80 euro). Greek wages stay at 5 drachma/h, olive oil becomes cheaper abroad and jobs are kept, but imports (house tools) get more expensive; the central bank could also devalue actively (external devaluation). With the euro this is impossible: Greece must regain competitiveness by cutting wages, laying off workers, raising productivity or VAT (internal devaluation) and pursue austerity; this is slow and causes unemployment and social unrest.",k:["drachma depreciates","exports cheaper, imports dearer","euro: no exchange rate adjustment","wage cuts / layoffs = internal devaluation","austerity"]},
 {ch:"r10",q:"Ireland faces a positive demand shock, France a negative one, both in the euro area. Explain the problem for the ECB and the possible solutions.",a:"Ireland: AD rises, output above potential, prices rise (inflation gap): it needs higher interest rates. France: AD falls, output and prices fall (unemployment gap): it needs lower rates. One ECB rate damages one of them. With own currencies Ireland's currency would appreciate (fewer exports, AD falls) and France's would depreciate (more exports, AD rises): automatic correction. In the euro area adjustment must come through wages (Ireland's higher wages shift AS left back to potential with higher prices; France's lower wages shift AS right with lower prices) or fiscal policy (contractionary in Ireland, expansionary in France).",k:["inflation gap vs unemployment gap","one rate cannot fit both","own currencies would adjust","wages / AS adjustment","fiscal policy"]},
 {ch:"r10",q:"What is austerity and what forms of government labor-market intervention appear on the slides?",a:"Austerity: policies that reduce public-sector debt by curtailing government spending and borrowing, especially when a country risks defaulting; this deflationary fiscal policy pushes down wages and inflation (e.g. public sector wage cuts of about 7%, 30% cut in special bonuses, less overtime pay, hiring freeze). Interventions: minimum/maximum wages, maximum working week, anti-discrimination laws, cutting non-essential programs, union legislation, health and safety laws, nudges, education and training, wage freezes for government employees.",k:["definition","deflationary effect","examples"]}
